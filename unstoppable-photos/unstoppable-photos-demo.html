.ps {
  --b-raspberry: #C30045;
  --b-magenta: #D60075;
  --b-magenta-dark: #B8005F;
  --b-lavender: #C27FCD;
  --b-coral: #E64A47;
  --b-pink-50: #FCF0F7;
  --b-pink-100: #F8E1EE;
  --b-ink: #272727;
  --b-slate: #44515C;
  --b-muted: #6E7880;
  --b-line: #ECE6EA;
  --b-track: #F1EBEF;
  --b-green: #3A7E4C;
  --b-grad: linear-gradient(120deg, #C27FCD 0%, #D23A8E 45%, #C30045 72%, #E64A47 100%);
  --ps-font: "PS Montserrat", Montserrat, "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --ps-mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  container: ps / inline-size;
  position: relative;
  isolation: isolate;
  overflow: hidden;
  border-radius: 28px;
  color-scheme: light;
  color: #fff;
  font-family: var(--ps-font);
  font-size: 15px;
  font-weight: 500;
  line-height: 1.45;
  text-align: left;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent;
  background:
    radial-gradient(42% 32% at 0% 0%, rgba(194, 127, 205, .6), rgba(194, 127, 205, 0) 72%),
    radial-gradient(46% 36% at 100% 100%, rgba(230, 74, 71, .55), rgba(230, 74, 71, 0) 72%),
    radial-gradient(56% 42% at 50% 46%, rgba(252, 2, 179, .62), rgba(252, 2, 179, 0) 72%),
    linear-gradient(180deg, #C4024B 0%, #C00147 55%, #A90144 100%);
}
/* Only when the app is the whole page (demo file): imitate the intranet's light page. Inside SharePoint the page is left alone. */
body:has(> #ps-app) { margin: 0; padding: 24px 16px; background: #FAFAFA; }
body:has(> #ps-app) > .ps { max-width: 1180px; margin: 0 auto; }

.ps *, .ps *::before, .ps *::after { box-sizing: border-box; }
.ps [hidden] { display: none !important; }
.ps button { font: inherit; color: inherit; cursor: pointer; margin: 0; }
.ps button:focus-visible, .ps a:focus-visible, .ps label:focus-within { outline: 3px solid #fff; outline-offset: 3px; }
.ps-stack:focus-visible { outline: 2px solid rgba(255, 255, 255, .55); outline-offset: 8px; }
.ps-sheet button:focus-visible, .ps-sheet a:focus-visible, .ps-panel button:focus-visible, .ps-menu button:focus-visible { outline-color: var(--b-magenta); }
.ps h2, .ps h3, .ps p { margin: 0; }
.ps img { max-width: none; }
.ps-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
.ps-ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ps-ic--fill { fill: currentColor; stroke: none; }
.ps-ic--bold { stroke-width: 2.8; }

.ps-stage { position: relative; max-width: 1120px; margin: 0 auto; min-height: 600px; display: flex; flex-direction: column; gap: 14px; padding: 16px 16px 14px; }
.ps-main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
@container ps (min-width: 700px) { .ps-stage, .ps-main { gap: 16px; } .ps-stage { padding: 22px 28px 18px; } }
.ps.is-full { border-radius: 0; overflow-y: auto; }
.ps.is-full .ps-stage { max-width: 1500px; min-height: 100vh; }

/* glass, as on the app's start screen */
.ps-glass, .ps-round, .ps-tabs, .ps-banner, .ps-act-tile, .ps-btn--glass {
  background: linear-gradient(180deg, rgba(255, 255, 255, .26), rgba(255, 255, 255, .11));
  border: 1px solid rgba(255, 255, 255, .34);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .28), 0 12px 30px -16px rgba(60, 0, 20, .6);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  backdrop-filter: blur(14px) saturate(140%);
}

/* header */
.ps-top { position: relative; z-index: 30; display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 12px; }
.ps-round { width: 44px; height: 44px; padding: 0; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: .92rem; letter-spacing: .02em; }
.ps-round .ps-ic { width: 22px; height: 22px; }
.ps-brand { min-width: 0; text-align: center; }
.ps-name { display: block; font-weight: 800; font-size: clamp(1.02rem, 4.6cqi, 1.32rem); letter-spacing: -.01em; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ps-sub { display: block; min-height: 1.2em; margin-top: 2px; font-size: .8rem; font-weight: 600; opacity: .88; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.ps-menu { position: absolute; top: 54px; right: 0; width: 290px; max-width: calc(100cqi - 32px); padding: 8px; border-radius: 18px; background: #fff; color: var(--b-ink); box-shadow: 0 26px 56px -20px rgba(40, 0, 15, .6); z-index: 40; }
.ps-menu-lang { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 10px 10px 12px; font-weight: 700; font-size: .9rem; }
.ps-seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--b-pink-50); }
.ps-seg button { border: 0; background: none; padding: 5px 11px; border-radius: 999px; font-weight: 800; font-size: .78rem; color: var(--b-magenta); }
.ps-seg button[aria-pressed="true"] { background: var(--b-magenta); color: #fff; }
.ps-mi { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 12px; border: 0; border-radius: 12px; background: none; text-align: left; font-weight: 600; font-size: .92rem; color: var(--b-ink) !important; }
.ps-mi:hover { background: var(--b-pink-50); }
.ps-mi .ps-ic { color: var(--b-magenta); }
.ps-menu-keys { margin: 4px 12px 6px; padding-top: 8px; border-top: 1px solid var(--b-line); font-size: .74rem; color: var(--b-muted); }

/* tabs: glass pill, active tab is a white pill like the app's main button */
.ps-tabs { align-self: center; display: inline-flex; gap: 2px; padding: 4px; border-radius: 999px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.ps-tabs button { flex: none; border: 0; background: none; color: #fff; padding: 9px 18px; border-radius: 999px; font-weight: 700; font-size: .9rem; white-space: nowrap; }
.ps-tabs button[aria-selected="true"] { background: #fff; color: var(--b-magenta); box-shadow: 0 6px 16px -8px rgba(60, 0, 20, .6); }
.ps-tabs button:not([aria-selected="true"]):hover { background: rgba(255, 255, 255, .14); }

.ps-banner .ps-ic { width: 16px; height: 16px; vertical-align: -3px; }
.ps-banner { align-self: center; max-width: 760px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 14px; padding: 10px 16px; border-radius: 16px; font-size: .85rem; font-weight: 600; text-align: center; }

/* buttons */
.ps-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 10px 20px; border: 0; border-radius: 999px; background: var(--b-magenta); color: #fff !important; font-weight: 700; font-size: .9rem; line-height: 1.2; text-decoration: none; white-space: nowrap; box-shadow: 0 10px 22px -14px rgba(214, 0, 117, .9); transition: background .15s ease, transform .15s ease; }
.ps-btn:hover { background: var(--b-magenta-dark); }
.ps-btn:active { transform: scale(.97); }
.ps-btn .ps-ic { width: 18px; height: 18px; }
.ps-btn--soft { background: var(--b-pink-50); color: var(--b-magenta) !important; box-shadow: none; }
.ps-btn--soft:hover { background: var(--b-pink-100); }
.ps-btn--white { background: #fff; color: var(--b-magenta) !important; }
.ps-btn--white:hover { background: var(--b-pink-50); }
.ps-btn--glass { color: #fff !important; }
.ps-btn--sm { min-height: 34px; padding: 7px 14px; font-size: .82rem; }
.ps-btn--icon { width: 42px; padding: 0; }
.ps-btn[disabled] { opacity: .55; cursor: default; transform: none; }
.ps-btn.is-spinning .ps-ic { animation: ps-spin .8s linear infinite; }
.ps-linkbtn { border: 0; background: none; padding: 0; font-weight: 700; color: var(--b-magenta); text-decoration: underline; text-underline-offset: 3px; }
.ps-foot .ps-linkbtn, .ps-banner .ps-linkbtn { color: #fff; }

/* swipe view */
.ps-swipe { display: flex; flex-direction: column; align-items: center; gap: 14px; --ps-ratio: 3 / 4; --ps-w: min(100%, max(250px, min(400px, calc((100dvh - 372px) * .75)))); }
@container ps (min-width: 700px) {
  .ps[data-shape="auto"] .ps-swipe { --ps-ratio: 4 / 3; --ps-w: min(100%, max(380px, min(680px, calc((100dvh - 350px) * 1.3333)))); }
}
.ps[data-shape="landscape"] .ps-swipe { --ps-ratio: 4 / 3; --ps-w: min(100%, max(300px, min(680px, calc((100dvh - 350px) * 1.3333)))); }
.ps[data-shape="square"] .ps-swipe { --ps-ratio: 1 / 1; --ps-w: min(100%, max(260px, min(520px, calc(100dvh - 350px)))); }
.ps-progress-row { width: var(--ps-w); display: flex; align-items: center; gap: 10px; }
.ps-progress { flex: 1; min-width: 0; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .22); overflow: hidden; }
.ps-catbar { flex: none; display: flex; }
.ps-cat { display: inline-flex; align-items: center; height: 30px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .34); background: rgba(255, 255, 255, .18); color: #fff; font-weight: 800; font-size: .82rem; letter-spacing: .02em; white-space: nowrap; animation: ps-pop .35s ease; }
.ps-cat--logo { border-color: #fff; background: #fff; }
.ps-cat--rebel { border-color: rgba(213, 168, 255, .45); background: #050303; }
.ps-logo { display: block; flex: none; background: center / contain no-repeat; }

.ps-cat .ps-logo--belfius { width: 86px; height: 19px; }
.ps-cat .ps-logo--rebel { width: 72px; height: 20px; }
/* ReBel look while a ReBel photo is up: black with a lilac glow (#D5A8FF from the ReBel logo) */
.ps-themer { position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: 0; transition: opacity .7s ease;
  background:
    radial-gradient(56% 42% at 50% 46%, rgba(213, 168, 255, .30), rgba(213, 168, 255, 0) 72%),
    radial-gradient(42% 32% at 100% 0%, rgba(213, 168, 255, .16), rgba(213, 168, 255, 0) 70%),
    linear-gradient(180deg, #1A1420 0%, #0D0A10 55%, #050303 100%); }
.ps.is-rebel .ps-themer { opacity: 1; }
/* category title card */
.ps-chapter { position: absolute; inset: 0; z-index: 7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; border-radius: 26px; background: #fff; color: var(--b-ink); text-align: center; box-shadow: 0 30px 60px -26px rgba(50, 0, 18, .8); animation: ps-chapter-in .45s cubic-bezier(.2, .8, .2, 1); }
.ps-chapter.is-out { pointer-events: none; animation: ps-chapter-out .32s ease forwards; }
.ps-chapter h2 { margin: 0; font-size: clamp(1.9rem, 7cqi, 2.6rem); font-weight: 800; letter-spacing: -.01em; line-height: 1.1; color: var(--b-ink); }
.ps-chapter p { margin: 0; font-weight: 700; color: var(--b-slate); }
.ps-chapter--rebel { background: #050303; color: #D5A8FF; box-shadow: 0 30px 60px -26px rgba(0, 0, 0, .9), inset 0 0 0 1px rgba(213, 168, 255, .25); }
.ps-chapter--rebel .ps-kicker, .ps-chapter--rebel p { color: #D5A8FF; }
.ps-chapter .ps-logo--belfius { width: min(78%, 270px); aspect-ratio: 420 / 91; margin: 4px 0; }
.ps-chapter .ps-logo--rebel { width: min(72%, 250px); aspect-ratio: 360 / 100; margin: 4px 0; }
.ps-chapter-go { margin-top: 10px; min-width: 150px; }
.ps-chapter--rebel .ps-chapter-go { background: #D5A8FF; color: #050303 !important; box-shadow: none; }
.ps-chapter--rebel .ps-chapter-go:hover { background: #E3C6FF; }
.ps-chapter--rebel .ps-chapter-go:focus-visible { outline-color: #D5A8FF; }
.ps.is-rebel .ps-progress i { background: #D5A8FF; }
.ps.is-rebel .ps-act--hero .ps-ic--fill { fill: url(#ps-grad-rebel); }
.ps.is-rebel .ps-act--keep:hover .ps-act-tile { background: rgba(213, 168, 255, .35); }
.ps-progress i { display: block; width: 0; height: 100%; border-radius: inherit; background: #fff; transition: width .45s ease; }
.ps-stack { position: relative; width: var(--ps-w); aspect-ratio: var(--ps-ratio); margin-bottom: 24px; touch-action: none; user-select: none; -webkit-user-select: none; outline: none; border-radius: 26px; }

/* panels in the card slot: intro, done, empty, setup */

/* action tiles under the card, like the app's shortcut tiles */

.ps-toast { position: absolute; left: 50%; bottom: 12px; z-index: 50; display: flex; align-items: center; gap: 12px; max-width: calc(100% - 32px); padding: 9px 9px 9px 16px; border-radius: 999px; background: rgba(30, 6, 17, .86); color: #fff; font-size: .88rem; font-weight: 600; box-shadow: 0 18px 40px -16px rgba(0, 0, 0, .65); opacity: 0; pointer-events: none; transform: translate(-50%, 16px); transition: opacity .25s ease, transform .25s ease; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }

/* white sheets: results, manage, connection details */
.ps-sheet { width: 100%; max-width: 1060px; align-self: center; padding: 20px 18px 22px; border-radius: 24px; background: #fff; color: var(--b-ink); box-shadow: 0 30px 70px -32px rgba(50, 0, 18, .75); }

/* results */

.ps-res-grid { display: grid; gap: 26px; margin-top: 22px; }

.ps-podium { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.22fr) minmax(0, 1fr); align-items: end; gap: clamp(8px, 2.4cqi, 20px); }
.ps-pod { display: flex; flex-direction: column; gap: 8px; min-width: 0; margin: 0; }
.ps-pod--1 { order: 2; }
.ps-pod--2 { order: 1; }
.ps-pod--3 { order: 3; }
.ps-pod-ph { position: relative; aspect-ratio: 4 / 5; overflow: hidden; border-radius: 18px; background: var(--b-track); box-shadow: 0 18px 34px -22px rgba(50, 0, 18, .7); }
.ps-pod--1 .ps-pod-ph { padding: 4px; background: var(--b-grad); }

.ps-medal { position: absolute; top: 10px; left: 10px; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .45); background: rgba(25, 0, 10, .55); color: #fff; font-weight: 800; font-size: .92rem; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }

.ps-highs { display: grid; gap: 10px; margin-top: 20px; }
@container ps (min-width: 640px) { .ps-highs { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); } }
.ps-high { display: flex; align-items: center; gap: 12px; min-width: 0; padding: 12px; border: 1px solid var(--b-line); border-radius: 16px; }
.ps-high > img, .ps-high-ic { flex: none; width: 52px; height: 52px; border-radius: 13px; object-fit: cover; }

.ps-high-label { display: block; font-size: .7rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--b-magenta); }

.ps-rank { list-style: none; margin: 0; padding: 0; }

.ps-chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; background: var(--b-pink-50); color: var(--b-magenta); font-size: .7rem; font-weight: 700; white-space: nowrap; }
.ps-chip--pass { background: #EEF0F2; color: var(--b-slate); }
.ps-chip--hero { background: #F4E8FA; color: #8A2E9C; }
.ps-chip--split { background: #FFF1E2; color: #94470A; }
.ps-rrow-pct { text-align: right; font-weight: 800; font-size: 1.22rem; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.ps-rrow-pct small { display: block; margin-top: 4px; font-size: .68rem; font-weight: 700; letter-spacing: .02em; color: var(--b-muted); }
.ps-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 14px; font-size: .76rem; font-weight: 600; color: var(--b-muted); }

/* manage */
.ps-drop { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 16px; padding: 26px 18px; border: 2px dashed #E9B6CF; border-radius: 20px; background: var(--b-pink-50); text-align: center; cursor: pointer; transition: background .15s ease, border-color .15s ease; }
.ps-drop:hover, .ps-drop.is-over { background: var(--b-pink-100); border-color: var(--b-magenta); }
.ps-drop:focus-within { outline: 3px solid var(--b-magenta); outline-offset: 2px; }
.ps-drop-ic { display: grid; place-items: center; width: 52px; height: 52px; margin-bottom: 4px; border-radius: 16px; background: #fff; color: var(--b-magenta); box-shadow: 0 8px 20px -12px rgba(214, 0, 117, .7); }
.ps-drop-ic .ps-ic { width: 26px; height: 26px; }

.ps-drop small { max-width: 52ch; font-size: .78rem; color: var(--b-muted); }
.ps-file { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip-path: inset(50%); }
.ps-ups { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; }
.ps-ups-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; font-size: .82rem; font-weight: 700; color: var(--b-slate); }
.ps-up { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 7px 12px 7px 7px; border: 1px solid var(--b-line); border-radius: 14px; font-size: .85rem; }
.ps-up img, .ps-up-ph { width: 40px; height: 40px; border-radius: 10px; object-fit: cover; background: var(--b-track); }
.ps-up-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.ps-up-name small { display: block; font-size: .74rem; font-weight: 600; color: #B42318; white-space: normal; }
.ps-up-st { font-size: .76rem; font-weight: 700; color: var(--b-muted); white-space: nowrap; }
.ps-up.is-done .ps-up-st { color: var(--b-green); }
.ps-up.is-error .ps-up-st { color: #B42318; }
.ps-man-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-top: 18px; }
.ps-grid { list-style: none; margin: 14px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px 14px; }
.ps-ph { position: relative; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.ps-ph-img { position: relative; aspect-ratio: 4 / 3; overflow: hidden; border-radius: 14px; background: var(--b-track); }
.ps-ph-img img { display: block; width: 100%; height: 100%; object-fit: cover; }
.ps-ph-del { position: absolute; top: 8px; right: 8px; display: grid; place-items: center; width: 34px; height: 34px; padding: 0; border: 0; border-radius: 50%; background: rgba(255, 255, 255, .94); color: var(--b-slate); box-shadow: 0 4px 12px -6px rgba(0, 0, 0, .45); opacity: 0; transition: opacity .15s ease; }
.ps-ph-del .ps-ic { width: 18px; height: 18px; }
.ps-ph:hover .ps-ph-del, .ps-ph-del:focus-visible { opacity: 1; }
@media (hover: none) { .ps-ph-del { opacity: 1; } }
.ps-ph-confirm { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 10px; background: rgba(30, 6, 17, .8); color: #fff; text-align: center; font-size: .85rem; font-weight: 700; }
.ps-ph-confirm .ps-row { gap: 6px; }
.ps-cap-in { width: 100%; padding: 8px 10px; border: 1px solid var(--b-line); border-radius: 10px; background: #fff; color: var(--b-ink); font: inherit; font-size: .85rem; font-weight: 600; }
.ps-cap-in:hover { border-color: #DCCFD7; }
.ps-cap-in:focus { outline: 2px solid var(--b-magenta); outline-offset: 0; border-color: transparent; }
.ps-ph-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: .72rem; font-weight: 600; color: var(--b-muted); }
.ps-saved { display: inline-flex; align-items: center; gap: 3px; color: var(--b-green); font-weight: 700; }
.ps-saved .ps-ic { width: 14px; height: 14px; stroke-width: 2.6; }
.ps-large { padding: 1px 7px; border-radius: 999px; background: #FFF1E2; color: #94470A; font-weight: 700; }
.ps-count { font-size: .85rem; font-weight: 700; color: var(--b-muted); }
.ps-man-cat { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 16px; font-size: .85rem; font-weight: 700; color: var(--b-slate); }
.ps-filter { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
.ps-filter button { padding: 6px 14px; border: 1px solid var(--b-line); border-radius: 999px; background: #fff; color: var(--b-slate); font-weight: 700; font-size: .82rem; }
.ps-filter button span { margin-left: 2px; font-weight: 600; color: var(--b-muted); }
.ps-filter button[aria-pressed="true"] { border-color: var(--b-magenta); background: var(--b-magenta); color: #fff; }
.ps-filter button[aria-pressed="true"] span { color: rgba(255, 255, 255, .8); }
.ps-filter button.is-rebel[aria-pressed="true"] { border-color: #050303; background: #050303; color: #D5A8FF; }
.ps-catseg { display: flex; padding: 3px; border-radius: 999px; background: var(--b-track); }
.ps-catseg button { flex: 1; min-width: 0; padding: 5px 8px; border: 0; border-radius: 999px; background: none; color: var(--b-muted); font-weight: 700; font-size: .74rem; }
.ps-catseg button[aria-pressed="true"] { background: #fff; color: var(--b-magenta); box-shadow: 0 2px 6px -3px rgba(0, 0, 0, .3); }
.ps-catseg button.is-rebel[aria-pressed="true"] { background: #050303; color: #D5A8FF; }

/* connection details */
.ps-dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 18px; margin: 18px 0; font-size: .85rem; }
.ps-dl dt { font-weight: 600; color: var(--b-muted); }
.ps-dl dd { margin: 0; font-family: var(--ps-mono); font-size: .8rem; color: var(--b-ink); overflow-wrap: anywhere; }

/* sign-in states, on the stage like the app's loading screens */
.ps-gate { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; min-height: 440px; padding: 30px 8px 50px; text-align: center; }
.ps-gate h2 { max-width: 22ch; font-size: 1.6rem; font-weight: 800; letter-spacing: -.01em; line-height: 1.2; text-wrap: balance; }
.ps-gate p { max-width: 44ch; opacity: .94; }
.ps-gate code { padding: 6px 12px; border: 1px solid rgba(255, 255, 255, .3); border-radius: 10px; background: rgba(255, 255, 255, .16); font-family: var(--ps-mono); font-size: .88rem; overflow-wrap: anywhere; }
.ps-gate-ic { display: grid; place-items: center; width: 72px; height: 72px; border-radius: 24px; }
.ps-gate-ic .ps-ic { width: 32px; height: 32px; }
.ps-gate .ps-small { color: rgba(255, 255, 255, .8) !important; }
.ps-spin { width: 62px; height: 62px; animation: ps-spin 1.1s cubic-bezier(.5, .15, .5, .85) infinite; }
.ps-spin path { fill: none; stroke: #fff; stroke-width: 7; stroke-linecap: round; }

.ps-foot { display: flex; justify-content: center; min-height: 22px; margin-top: auto; padding-top: 4px; text-align: center; font-size: .78rem; font-weight: 600; color: rgba(255, 255, 255, .88); }
.ps-status { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 8px; }
.ps-dot { display: inline-block; width: 7px; height: 7px; margin-right: 2px; border-radius: 50%; background: #9AF0BE; }
.ps-dot--busy { background: #FFD27A; animation: ps-blink 1s ease-in-out infinite; }

@keyframes ps-spin { to { transform: rotate(360deg); } }
@keyframes ps-chapter-in { from { opacity: 0; transform: translateY(10px) scale(.92); } to { opacity: 1; transform: none; } }
@keyframes ps-chapter-out { to { opacity: 0; transform: scale(1.04); } }
@keyframes ps-pop { from { opacity: 0; transform: translateY(6px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes ps-shimmer { from { background-position: 160% 0; } to { background-position: -60% 0; } }
@keyframes ps-pulse { 0% { box-shadow: 0 0 0 0 rgba(58, 126, 76, .45); } 70% { box-shadow: 0 0 0 9px rgba(58, 126, 76, 0); } 100% { box-shadow: 0 0 0 0 rgba(58, 126, 76, 0); } }
@keyframes ps-blink { 50% { opacity: .35; } }

@media (prefers-reduced-motion: reduce) {
  .ps-card, .ps-card.is-flying, .ps-act-tile, .ps-toast, .ps-progress i, .ps-bar i { transition-duration: .01s !important; }
  .ps-card-skel, .ps-spin, .ps-live i, .ps-dot--busy, .ps-btn.is-spinning .ps-ic { animation: none !important; }
}

  /* ---------- SharePoint REST ---------- */
  function spUrl(path) { return /^https?:\/\//i.test(path) ? path : SITE + path; }

  function spFetch(path, o) {
    o = o || {};
    var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, o.timeout || 20000) : null;
    return fetch(spUrl(path), {
      method: o.method || 'GET', credentials: 'same-origin', cache: 'no-store',
      headers: o.headers || { Accept: NOMETA }, body: o.body, signal: ctrl ? ctrl.signal : undefined
    }).then(function (res) { clearTimeout(timer); return res; }, function (e) {
      clearTimeout(timer);
      throw new Error(e && e.name === 'AbortError' ? t('errTimeout') : t('errNetwork'));
    });
  }

  async function readJson(res) {
    var type = res.headers.get('content-type') || '';
    if (type.indexOf('json') === -1) throw new Error(t('errNotJson', { type: type || '–', status: res.status }));
    return res.json();
  }

  async function httpError(res, what) {
    var msg = '';
    try {
      var j = await res.json();
      var e = j['odata.error'] || j.error || {};
      msg = (e.message && (e.message.value || e.message)) || '';
    } catch (err) { /* not JSON */ }
    var out = new Error((what ? what + ': ' : '') + 'HTTP ' + res.status + (msg ? ' – ' + msg : ''));
    out.status = res.status;
    return out;
  }

  async function spGet(path, what) {
    var res = await spFetch(path);
    if (!res.ok) throw await httpError(res, what);
    return readJson(res);
  }

  async function spGetAll(path, what) {
    var out = [], next = path, pages = 0;
    while (next && pages++ < 100) {
      var j = await spGet(next, what);
      out = out.concat(j.value || []);
      next = j['odata.nextLink'] || j['@odata.nextLink'] || null;
    }
    return out;
  }

  var digest = { value: null, until: 0 };
  async function getDigest(fresh) {
    if (!fresh && digest.value && Date.now() < digest.until) return digest.value;
    var res = await spFetch('/_api/contextinfo', { method: 'POST', headers: { Accept: NOMETA } });
    if (!res.ok) throw await httpError(res, 'contextinfo');
    var j = await readJson(res);
    digest = { value: j.FormDigestValue, until: Date.now() + Math.max(120, (j.FormDigestTimeoutSeconds || 1800) - 120) * 1000 };
    return digest.value;
  }

  // POST with a request digest; retries once with a fresh digest if SharePoint says it expired.
  async function spSend(path, o) {
    o = o || {};
    for (var attempt = 0; attempt < 2; attempt++) {
      var headers = { Accept: NOMETA, 'X-RequestDigest': await getDigest(attempt > 0) };
      if (o.json !== undefined) headers['Content-Type'] = VERBOSE;
      if (o.headers) Object.keys(o.headers).forEach(function (k) { headers[k] = o.headers[k]; });
      var res = await spFetch(path, { method: 'POST', headers: headers, body: o.json !== undefined ? JSON.stringify(o.json) : o.body, timeout: o.timeout });
      if (res.ok) return res;
      var err = await httpError(res, o.what);
      if (attempt === 0 && res.status === 403 && /security validation|digest/i.test(err.message)) continue;
      throw err;
    }
  }

  function listPath(title) { return "/_api/web/lists/GetByTitle('" + encodeURIComponent(String(title).replace(/'/g, "''")) + "')"; }

  async function checkLib() {
    try {
      var j = await spGet(libPath() + '?$select=Id,BaseTemplate,ListItemEntityTypeFullName,RootFolder/ServerRelativeUrl&$expand=RootFolder');
      if ([101, 109, 851].indexOf(j.BaseTemplate) === -1) throw new Error(t('errNotLibrary', { name: CONFIG.photoLibrary }));
      S.lib = { state: 'ok', entityType: j.ListItemEntityTypeFullName, url: (j.RootFolder && j.RootFolder.ServerRelativeUrl) || '', hasCat: false };
    } catch (e) {
      S.lib = { state: e.status === 404 ? 'missing' : 'error', error: e.message };
      if (e.status !== 404) S.lastError = e.message;
      return;
    }
    await ensureCategoryField();
  }

  // The photo library gets a Category column; admins create it the first time they open the app.
  async function ensureCategoryField() {
    try {
      var f = await spGet(libPath() + "/fields?$select=InternalName&$filter=InternalName eq 'Category'");
      S.lib.hasCat = (f.value || []).length > 0;
      if (!S.lib.hasCat && S.realAdmin) {
        await spSend(libPath() + '/fields', { json: { __metadata: { type: 'SP.FieldText' }, FieldTypeKind: 2, Title: 'Category' } });
        S.lib.hasCat = true;
        try { await spSend(libPath() + "/DefaultView/ViewFields/addViewField('Category')"); } catch (e) { /* optional */ }
      }
    } catch (e) { S.lastError = e.message; }
  }

  async function checkVotes() {
    try {
      var j = await spGet(votesPath() + '?$select=Id,ListItemEntityTypeFullName,RootFolder/ServerRelativeUrl&$expand=RootFolder');
      var f = await spGet(votesPath() + "/fields?$select=InternalName&$filter=InternalName eq 'Verdict' or InternalName eq 'DwellMs' or InternalName eq 'PhotoName'");
      var have = {};
      (f.value || []).forEach(function (x) { have[x.InternalName] = true; });
      S.list = { state: 'ok', entityType: j.ListItemEntityTypeFullName, url: (j.RootFolder && j.RootFolder.ServerRelativeUrl) || '', fields: have };
      if (S.realAdmin && !(have.Verdict && have.DwellMs && have.PhotoName)) {
        try { await ensureVoteFields(); } catch (e) { S.lastError = e.message; }
      }
      if (!S.list.fields.Verdict) { S.list.state = 'error'; S.list.error = t('errNoVerdict', { list: CONFIG.votesList }); }
      await checkVotePrivacy();
    } catch (e) {

  // ReadSecurity 2 = people can only read their own rows (item-level permissions). With that on, only

    S.list.seeAll = true;

    }
  }

  // Item-level permissions on the votes list: people read and edit only their own rows. Needs Manage Lists rights.
  async function lockVotes() {
    await spSend(votesPath(), {
      json: { __metadata: { type: 'SP.List' }, ReadSecurity: 2, WriteSecurity: 2 },
      headers: { 'X-HTTP-Method': 'MERGE', 'IF-MATCH': '*' }, what: CONFIG.votesList

  async function loadSpVotes(sinceId) {
    var filter = [];
    if (!seesAll()) filter.push('AuthorId eq ' + Number(S.user.id));
    if (sinceId) filter.push('Id gt ' + Number(sinceId));
    var rows = await spGetAll(votesPath() + '/items?$select=Id,Title,Verdict,DwellMs,Created,AuthorId,Author/Title&$expand=Author' +
      (filter.length ? '&$filter=' + filter.join(' and ') : '') + '&$orderby=Id asc&$top=2000', CONFIG.votesList);
    var maxId = sinceId || 0, votes = [];
    rows.forEach(function (it) {

    });
    return { votes: votes, maxId: maxId };

  // Server votes replace (full) or extend (incremental) what we have; unsaved local swipes are kept.
  function mergeVotes(server, full) {
    if (full) {
      var pending = S.votes.filter(function (v) { return !v.spId && !v.example; });
      S.votes = server.concat(pending);
      return;
    }
    var have = {};
    S.votes.forEach(function (v) { if (v.spId) have[v.spId] = true; });
    server.forEach(function (v) { if (!have[v.spId]) S.votes.push(v); });
  }

    if (S.list.fields.PhotoName) body.PhotoName = String((S.byId[v.photo] || {}).name || '').slice(0, 255);

  function loadLocalVotes() {

      return { photo: String(v.photo), verdict: v.verdict, ms: v.ms || 0, at: v.at, user: S.user.key, name: S.user.name, seq: 1e12 + (++S.seq) };

  // Swipes waiting for SharePoint survive a reload: they're sent next time the page opens.
  function pendingKey() { return 'pending@' + SITE + '|' + CONFIG.votesList + '|' + (S.user ? S.user.key : ''); }
  function persistPending() {
    if (S.store !== 'sharepoint') return;
    var list = S.queue.filter(function (j) { return !j.cancelled; }).map(function (j) { return j.v; }).concat(S.failed)
      .map(function (v) { return { photo: v.photo, verdict: v.verdict, ms: v.ms, at: v.at }; });
    setStore(pendingKey(), list.length ? list : null);
  }

  /* ---------- recording + saving swipes ---------- */
  function mkVote(photo, verdict, ms) {
    return { photo: photo, verdict: verdict, ms: Math.round(ms || 0), user: S.user.key, name: S.user.name,
      at: new Date().toISOString(), seq: 1e12 + (++S.seq) };
  }

  function record(photo, verdict, ms) {
    var v = mkVote(photo, verdict, ms);
    S.votes.push(v);
    S.done[photo] = true;
    S.history.push(v);
    if (S.history.length > 50) S.history.shift();
    if (S.store === 'sharepoint') {
      v.job = { v: v, tries: 0 };
      S.queue.push(v.job);
      persistPending();
      flush();
    } else {
      saveLocalVotes();
      S.saved++;
    }
    renderStatus();
    renderTop();
    return v;
  }

  function restorePending() {
    var list = getStore(pendingKey(), null);
    if (!Array.isArray(list) || !list.length) return;
    list.forEach(function (x) {
      if (!x || VERDICTS.indexOf(x.verdict) === -1) return;
      var v = mkVote(String(x.photo), x.verdict, x.ms);
      v.at = x.at || v.at;
      v.job = { v: v, tries: 0 };
      S.votes.push(v);
      S.queue.push(v.job);
    });
    flush();
  }

  var flushing = false;
  async function flush() {
    if (flushing) return;
    flushing = true;
    while (S.queue.length && alive()) {
      var job = S.queue[0];
      job.sending = true;
      try {
        var id = await spAddVote(job.v);
        job.v.spId = id;
        S.saved++;
        if (S.queue[0] === job) S.queue.shift();
        if (job.cancelled && id) { try { await spRecycle(votesPath(), id); } catch (e) { /* the next swipe on this photo overrides it anyway */ } }
      } catch (e) {
        job.tries++;
        S.lastError = e.message;
        var permanent = e.status >= 400 && e.status < 500 && [408, 409, 429].indexOf(e.status) === -1;
        if (permanent || job.tries >= 4) {
          if (S.queue[0] === job) S.queue.shift();
          if (!job.cancelled) S.failed.push(job.v);
        } else {
          job.sending = false;
          renderStatus();
          await sleep(1500 * Math.pow(2, job.tries));
        }
      }
      job.sending = false;
      persistPending();
      renderStatus();
    }
    flushing = false;
    renderStatus();
  }

  function retryFailed() {
    S.failed.forEach(function (v) { v.job = { v: v, tries: 0 }; S.queue.push(v.job); });
    S.failed = [];
    persistPending();
    flush();
  }

  function undo() {
    if (S.busy || S.gate || !S.history.length) return;
    if (S.chapterOn) endChapter(true);
    var v = S.history.pop();
    S.votes = S.votes.filter(function (x) { return x !== v && !(v.spId && x.spId === v.spId); });
    if (S.store === 'sharepoint') {
      var job = v.job, qi = job ? S.queue.indexOf(job) : -1;
      if (qi !== -1 && !job.sending) S.queue.splice(qi, 1);
      else if (job && job.sending) job.cancelled = true;
      else if (v.spId) spRecycle(votesPath(), v.spId).catch(function (e) { S.lastError = e.message; });
      var fi = S.failed.indexOf(v);
      if (fi !== -1) S.failed.splice(fi, 1);
      persistPending();
    } else {
      saveLocalVotes();
      S.saved = Math.max(0, S.saved - 1);
    }
    delete S.done[v.photo];
    if (S.byId[v.photo]) {
      var was = S.topId && S.byId[S.topId] ? catOf(S.byId[S.topId]) : null;
      if (was && was !== catOf(S.byId[v.photo])) delete S.chaptersShown[was.id];
      S.deck = S.deck.filter(function (id) { return id !== v.photo; });
      S.deck.unshift(v.photo);
    }
    hideToast();
    if (S.view !== 'swipe') setView('swipe');
    renderStack({ enter: v.verdict });
    renderStatus();
    renderTop();
  }

  /* ---------- deck ---------- */
  function latest(votes) {
    var m = {};
    votes.forEach(function (v) {
      var k = v.user + '|' + v.photo;
      if (!m[k] || (v.seq || 0) >= (m[k].seq || 0)) m[k] = v;
    });
    return Object.keys(m).map(function (k) { return m[k]; });
  }

  function myVotes() {
    var m = {};
    if (!S.user) return m;
    latest(S.votes).forEach(function (v) { if (v.user === S.user.key) m[v.photo] = v.verdict; });
    return m;
  }

  // One category after the other (in the order of CONFIG.categories), shuffled within each.
  function groupedShuffle(ids) {
    var groups = cats().map(function () { return []; });
    ids.forEach(function (id) { groups[catIndex(catOf(S.byId[id]).id)].push(id); });
    return groups.reduce(function (all, g) { return all.concat(shuffle(g)); }, []);
  }

  function buildDeck() {
    S.done = {};
    var mine = myVotes();
    Object.keys(mine).forEach(function (id) { if (S.byId[id]) S.done[id] = true; });
    S.deck = groupedShuffle(S.photos.filter(function (p) { return !S.done[p.id]; }).map(function (p) { return p.id; }));
  }

  // Adds photos that appeared since the deck was built (new uploads, a refresh).
  function syncDeck() {
    var inDeck = {};
    S.deck.forEach(function (id) { inDeck[id] = true; });
    var fresh = S.photos.filter(function (p) { return !S.done[p.id] && !inDeck[p.id]; }).map(function (p) { return p.id; });
    // Slot new photos in at the end of their category, never in front of the card that's showing.
    shuffle(fresh).forEach(function (id) {
      var ci = catIndex(catOf(S.byId[id]).id), at = 0;
      for (var i = S.deck.length - 1; i >= 0; i--) {
        if (catIndex(catOf(S.byId[S.deck[i]]).id) <= ci) { at = i + 1; break; }
      }
      S.deck.splice(S.deck.length ? Math.max(1, at) : 0, 0, id);
    });
  }

  function restart() {
    S.done = {};
    S.history = [];
    S.chaptersShown = {};
    S.deck = groupedShuffle(S.photos.map(function (p) { return p.id; }));
    renderStack();
    renderTop();
  }

  var lastPhotoCheck = 0;
  async function checkNewPhotos() {
    if (S.mode !== 'sharepoint' || S.lib.state !== 'ok' || Date.now() - lastPhotoCheck < 15000) return;
    lastPhotoCheck = Date.now();
    var before = S.deck.length;
    try { await loadSpPhotos(); syncDeck(); } catch (e) { S.lastError = e.message; return; }
    if (S.deck.length !== before && S.view === 'swipe') renderStack();
    renderTop();
  }

  /* ---------- cards ---------- */
  function cardInner(p) {
    return '<div class="ps-card-inner"><div class="ps-card-bg"></div><div class="ps-card-skel"></div>' +
      '<img class="ps-card-img" alt="' + T('photoAlt', { n: S.photos.indexOf(p) + 1 }) + '" draggable="false">' +
      '<div class="ps-card-err">' + icon(P.image) + '<span>' + T('photoBroken') + '</span></div>' +
      '<div class="ps-tint ps-tint--keep"></div><div class="ps-tint ps-tint--pass"></div><div class="ps-tint ps-tint--hero"></div>' +
      '<span class="ps-stamp ps-stamp--keep">' + IC.keep + esc(L('keep')) + '</span>' +
      '<span class="ps-stamp ps-stamp--pass">' + IC.pass + esc(L('pass')) + '</span>' +
      '<span class="ps-stamp ps-stamp--hero">' + IC.hero + esc(L('hero')) + '</span></div>';
  }

  function makeCard(id) {
    var p = S.byId[id];
    var el = document.createElement('article');
    el.className = 'ps-card is-loading';
    el.dataset.id = id;
    el.setAttribute('aria-label', t('photoAlt', { n: S.photos.indexOf(p) + 1 }));
    el.innerHTML = cardInner(p);
    var img = el.querySelector('.ps-card-img');
    var ready = function () { el.classList.remove('is-loading'); fit(el); };
    img.addEventListener('load', ready);
    img.addEventListener('error', function () { el.classList.remove('is-loading'); el.classList.add('is-broken'); });
    img.src = p.src;
    if (img.complete && img.naturalWidth) ready();
    return el;
  }

  // Photos close to the card's shape fill it; others are shown whole on a blurred copy of themselves.
  function fit(el) {
    var img = el.querySelector('.ps-card-img');
    if (!img || !img.naturalWidth) return;
    var st = $('ps-stack');
    var box = st.offsetWidth && st.offsetHeight ? st.offsetWidth / st.offsetHeight : .75;
    var contain = Math.abs(Math.log((img.naturalWidth / img.naturalHeight) / box)) > .2;
    el.classList.toggle('is-contain', contain);
    var bg = el.querySelector('.ps-card-bg');
    if (contain && !bg.style.backgroundImage) bg.style.backgroundImage = 'url("' + img.src.replace(/["\\\n]/g, encodeURIComponent) + '")';
  }

  var preloaded = {};
  function preload(ids) {
    ids.forEach(function (id) {
      var p = S.byId[id];
      if (!p || preloaded[p.src]) return;
      var im = new Image();
      im.decoding = 'async';
      im.src = p.src;
      preloaded[p.src] = im;
    });
  }

  function cards() {
    return Array.prototype.filter.call($('ps-stack').children, function (el) {
      return el.classList.contains('ps-card') && !el.classList.contains('is-flying');
    });
  }
  function topCard() { return cards().filter(function (el) { return el.dataset.depth === '0'; })[0] || null; }
  function nextCard() { return cards().filter(function (el) { return el.dataset.depth === '1'; })[0] || null; }

  function outTransform(verdict, dx, dy) {
    var st = $('ps-stack'), w = st.offsetWidth || 360, h = st.offsetHeight || 480;
    if (verdict === 'keep') return 'translate(' + Math.round(w * 1.4 + Math.max(0, dx)) + 'px,' + Math.round(dy + 40) + 'px) rotate(22deg)';
    if (verdict === 'pass') return 'translate(' + Math.round(-w * 1.4 + Math.min(0, dx)) + 'px,' + Math.round(dy + 40) + 'px) rotate(-22deg)';
    return 'translate(' + Math.round(dx) + 'px,' + Math.round(-h * 1.5) + 'px) rotate(' + (dx * .03).toFixed(1) + 'deg)';
  }

  function renderStack(opts) {
    opts = opts || {};
    var stack = $('ps-stack');
    S.deck = S.deck.filter(function (id) { return S.byId[id]; });
    var want = S.deck.slice(0, 3);
    var have = cards();
    have.forEach(function (el) { if (want.indexOf(el.dataset.id) === -1) el.remove(); });
    var fresh = [], enter = null;
    want.forEach(function (id, d) {
      var el = have.filter(function (c) { return c.dataset.id === id && c.isConnected; })[0];
      if (!el) {
        el = makeCard(id);
        if (d === 0 && opts.enter) {
          enter = el;
          el.classList.add('is-dragging');
          el.style.transform = outTransform(opts.enter, 0, 0);
          el.style.opacity = '0';
        } else if (!opts.instant) {
          el.classList.add('is-new');
          fresh.push(el);
        }
        stack.insertBefore(el, stack.firstChild);
      } else if (el !== enter) {
        el.classList.remove('is-dragging', 'is-nudge');
        el.style.transform = '';
        el.style.opacity = '';
      }
      el.dataset.depth = String(d);
      if (d === 0) el.removeAttribute('aria-hidden'); else el.setAttribute('aria-hidden', 'true');
    });
    if (enter || fresh.length) {
      void stack.offsetWidth;   // apply the start position before animating
      if (enter) { enter.classList.remove('is-dragging'); enter.style.transform = ''; enter.style.opacity = ''; }
      fresh.forEach(function (el) { el.classList.remove('is-new'); });
    }

    var top = want[0] || null;
    if (top !== S.topId) { S.topId = top; S.shownAt = performance.now(); }
    var catTop = top ? catOf(S.byId[top]) : null;
    APP.classList.toggle('is-rebel', !!catTop && catTop.theme === 'rebel' && S.view === 'swipe');
    renderCatChip(catTop);
    preload(S.deck.slice(3, 6));

    var state = stack.querySelector('.ps-state');
    var html = top ? '' : panelHtml();
    if (html) {
      if (!state) { state = document.createElement('div'); state.className = 'ps-state'; stack.appendChild(state); }
      state.innerHTML = html;
    } else if (state) state.remove();

    var intro = stack.querySelector('.ps-intro');
    if (S.intro && top) {
      if (!intro) { intro = document.createElement('div'); intro.className = 'ps-intro'; stack.appendChild(intro); }
      intro.innerHTML = introHtml();
    } else if (intro) intro.remove();

    if (catTop && !S.intro && !S.chapterOn && catsInUse().length > 1 && !S.chaptersShown[catTop.id]) {
      if (catTop === catsInUse()[0]) S.chaptersShown[catTop.id] = true;   // the first brand starts right after the intro
      else startChapter(catTop);
    }

    var on = !!top && !S.intro && !S.chapterOn;
    ['pass', 'hero', 'keep'].forEach(function (v) { $('ps-btn-' + v).disabled = !on; });
    var total = S.photos.length;
    var seen = S.photos.filter(function (p) { return S.done[p.id]; }).length;
    $('ps-progress-bar').style.width = total ? (seen / total * 100).toFixed(1) + '%' : '0%';
  }

  // The brand's logo (built into the file) or, without one, its name.
  var LOGOS = { belfius: true, rebel: true };
  function catMark(c, big) {
    if (c.logo && LOGOS[c.logo]) return '<i class="ps-logo ps-logo--' + c.logo + '" role="img" aria-label="' + esc(c.name) + '"></i>';
    return big ? '<h2>' + esc(c.name) + '</h2>' : esc(c.name);
  }

  // Title card when the next brand starts: "Merk 2 van 6", its logo, "8 foto's" and a Verder button.
  // No timer: the vote buttons stay off until the player taps Verder (or presses Enter).
  function startChapter(c) {
    S.chaptersShown[c.id] = true;
    S.chapterOn = true;
    var stack = $('ps-stack'), old = stack.querySelector('.ps-chapter');
    if (old) old.remove();
    var inUse = catsInUse();
    var left = S.deck.filter(function (id) { return catOf(S.byId[id]).id === c.id; }).length;
    var el = document.createElement('div');
    el.className = 'ps-chapter' + (c.theme === 'rebel' ? ' ps-chapter--rebel' : '');
    el.setAttribute('role', 'dialog');
    el.setAttribute('aria-labelledby', 'ps-chapter-k ps-chapter-n');
    el.setAttribute('aria-describedby', 'ps-chapter-d');
    el.innerHTML = '<span class="ps-kicker" id="ps-chapter-k">' + T('chapterKicker', { i: inUse.indexOf(c) + 1, n: inUse.length }) + '</span>' +
      catMark(c, true) + '<p id="ps-chapter-d">' + esc(nPhotos(left)) + '</p>' +
      '<button type="button" class="ps-btn ps-chapter-go" data-act="chapter-go">' + T('chapterGo') + '</button>';
    el.children[1].id = 'ps-chapter-n';
    stack.appendChild(el);
    var ae = document.activeElement;   // don't pull the focus away from the rest of the intranet page
    if (!ae || ae === document.body || APP.contains(ae)) { try { el.querySelector('.ps-chapter-go').focus({ preventScroll: true }); } catch (e) { /* old browsers */ } }
  }

  function endChapter(now) {
    var stack = $('ps-stack'), el = stack.querySelector('.ps-chapter:not(.is-out)');
    if (el && el.contains(document.activeElement)) { try { stack.focus({ preventScroll: true }); } catch (e) { /* old browsers */ } }
    S.chapterOn = false;
    S.shownAt = performance.now();   // time on the title card doesn't count as looking at the photo
    if (el) {
      if (now || reduced()) el.remove();
      else { el.classList.add('is-out'); setTimeout(function () { el.remove(); }, 320); }
    }
    renderStack();
  }

  // Which category is up: the ReBel logo or the category name, above the card (never on the photo).
  function renderCatChip(c) {
    var el = $('ps-catbar');
    var show = !!c && catsInUse().length > 1;
    el.hidden = !show;
    if (!show) { el.innerHTML = ''; el.removeAttribute('data-cat'); return; }
    if (el.getAttribute('data-cat') === c.id) return;
    el.setAttribute('data-cat', c.id);
    var hasLogo = !!(c.logo && LOGOS[c.logo]);
    el.innerHTML = '<span class="ps-cat' + (hasLogo ? ' ps-cat--logo' : '') + (c.theme === 'rebel' ? ' ps-cat--rebel' : '') + '">' + catMark(c, false) + '</span>';
  }

  function panel(kind, ic, title, text, actions, kicker, extra) {
    return '<div class="ps-panel ps-panel--' + kind + '"><span class="ps-panel-ic">' + ic + '</span>' +
      (kicker ? '<span class="ps-kicker">' + esc(kicker) + '</span>' : '') +
      '<h2>' + esc(title) + '</h2>' + (text ? '<p>' + esc(text) + '</p>' : '') + (extra || '') +
      (actions ? '<div class="ps-row">' + actions + '</div>' : '') + '</div>';
  }

  // How I voted: 5 Top · 2 Unstoppable · 3 Flop
  function myTallyHtml() {
    var mine = myVotes(), n = { keep: 0, hero: 0, pass: 0 };
    S.photos.forEach(function (p) { if (mine[p.id]) n[mine[p.id]]++; });
    return '<div class="ps-tally">' + ['keep', 'hero', 'pass'].map(function (v) {
      return '<span class="ps-tally-i ps-tally-i--' + v + '"><b>' + n[v] + '</b>' + esc(L(v)) + '</span>';
    }).join('') + '</div>';
  }

  function panelHtml() {
    if (S.mode === 'sharepoint' && S.lib.state !== 'ok') {
      if (S.lib.state === 'error') return panel('error', icon(P.alert), t('libErrorTitle'), t('libError', { err: S.lib.error || S.lastError }), '');
      if (S.admin) return panel('setup', icon(P.setup), t('setupTitle'), t('setupText', { lib: CONFIG.photoLibrary, list: CONFIG.votesList }),
        '<button type="button" class="ps-btn" data-act="setup">' + T('setupBtn') + '</button>', t('setupKicker'));
      return panel('wait', icon(P.clock), t('notReadyTitle'), t('notReadyText'), '');
    }
    if (!S.photos.length) {
      if (S.admin) return panel('empty', icon(P.image), t('emptyTitle'), S.mode === 'demo' ? t('emptyDemo') : t('emptyAdmin', { lib: CONFIG.photoLibrary }),
        '<button type="button" class="ps-btn" data-act="view" data-id="manage">' + icon(P.upload) + T('addPhotos') + '</button>');
      return panel('empty', icon(P.image), t('emptyTitle'), t('emptyUser'), '');
    }
    if (!canSeeResults()) {
      return panel('done', icon(P.check), t('doneTitleThanks'), '',
        '<button type="button" class="ps-btn ps-btn--soft" data-act="restart">' + T('swipeAgain') + '</button>', t('doneKicker'), myTallyHtml());
    }
    return panel('done', icon(P.check), t('doneTitle'), '',
      '<button type="button" class="ps-btn" data-act="view" data-id="results">' + T('seeResults') + '</button>' +
      '<button type="button" class="ps-btn ps-btn--soft" data-act="restart">' + T('swipeAgain') + '</button>', t('doneKicker'), myTallyHtml());
  }

  function introHtml() {
    return '<div class="ps-panel ps-panel--intro"><span class="ps-kicker">' + T('introKicker') + '</span><h2>' + T('introTitle') + '</h2>' +
      '<ul class="ps-howto">' +
      '<li><span class="ps-howto-ic ps-howto-ic--keep">' + IC.keep + '</span><span><b>' + T('introRight') + '</b> = ' + esc(L('keep')) + '</span></li>' +
      '<li><span class="ps-howto-ic ps-howto-ic--pass">' + IC.pass + '</span><span><b>' + T('introLeft') + '</b> = ' + esc(L('pass')) + '</span></li>' +
      '<li><span class="ps-howto-ic ps-howto-ic--hero">' + IC.hero + '</span><span><b>' + T('introUp') + '</b> = ' + esc(L('hero')) + ', ' + T('introUpNote') + '</span></li>' +
      '</ul>' + (catsInUse().length > 1 ? '<p class="ps-small">' + T('introByBrand') + '</p>' : '') +
      '<p class="ps-small">' + T('introUndo') + '</p>' +
      '<button type="button" class="ps-btn" data-act="intro-start">' + T('introStart') + '</button></div>';
  }

  function dismissIntro() {
    S.intro = false;
    setStore('intro-seen', true);
    renderStack();
    try { $('ps-stack').focus({ preventScroll: true }); } catch (e) { /* old browsers */ }
  }

  /* ---------- swiping ---------- */
  function setMarks(card, k, p, h) {
    var q = function (s) { return card.querySelector(s); };
    q('.ps-stamp--keep').style.opacity = k; q('.ps-tint--keep').style.opacity = k;
    q('.ps-stamp--pass').style.opacity = p; q('.ps-tint--pass').style.opacity = p;
    q('.ps-stamp--hero').style.opacity = h; q('.ps-tint--hero').style.opacity = h;
  }

  function fly(verdict, drag) {
    var card = topCard();
    if (!card || S.busy || S.intro || S.chapterOn || S.gate) return;
    S.busy = true;
    var id = card.dataset.id;
    var ms = Math.min(600000, performance.now() - S.shownAt);
    setMarks(card, verdict === 'keep' ? 1 : 0, verdict === 'pass' ? 1 : 0, verdict === 'hero' ? 1 : 0);
    var go = function () {
      card.classList.remove('is-dragging', 'is-nudge');
      card.classList.add('is-flying');
      card.style.transform = outTransform(verdict, drag ? drag.dx : 0, drag ? drag.dy : 0);
      card.style.opacity = '0';
      setTimeout(function () { card.remove(); }, reduced() ? 30 : 520);
      var v = record(id, verdict, ms);
      S.deck.shift();
      S.busy = false;
      renderStack();
      voteToast(v);
      if (!S.deck.length) checkNewPhotos();
    };
    if (drag || reduced()) { go(); return; }
    // Buttons and keys: nudge the card and show the stamp for a moment, then let it fly.
    card.classList.add('is-nudge');
    card.style.transform = verdict === 'keep' ? 'translateX(26px) rotate(3deg)' : verdict === 'pass' ? 'translateX(-26px) rotate(-3deg)' : 'translateY(-26px)';
    setTimeout(go, 190);
  }

  var drag = null;
  function threshold() { return clamp($('ps-stack').offsetWidth * .26, 80, 150); }

  function onDown(e) {
    var card = topCard();
    if (!card || S.busy || S.intro || S.chapterOn || !card.contains(e.target) || (e.button != null && e.button !== 0)) return;
    var now = performance.now();
    drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, dx: 0, dy: 0, lx: e.clientX, ly: e.clientY, lt: now, vx: 0, vy: 0, card: card };
    card.classList.add('is-dragging');
    var next = nextCard();
    if (next) next.classList.add('is-dragging');
    try { card.setPointerCapture(e.pointerId); } catch (err) { /* older browsers */ }
  }

  function onMove(e) {
    if (!drag || e.pointerId !== drag.id) return;
    var now = performance.now(), dt = Math.max(1, now - drag.lt);
    drag.vx = (e.clientX - drag.lx) / dt;
    drag.vy = (e.clientY - drag.ly) / dt;
    drag.lx = e.clientX; drag.ly = e.clientY; drag.lt = now;
    drag.dx = e.clientX - drag.x0;
    drag.dy = e.clientY - drag.y0;
    drag.card.style.transform = 'translate(' + drag.dx + 'px,' + drag.dy + 'px) rotate(' + (drag.dx * .05).toFixed(2) + 'deg)';
    var th = threshold();
    var up = -drag.dy > Math.abs(drag.dx) ? clamp(-drag.dy / th, 0, 1) : 0;
    setMarks(drag.card, up ? 0 : clamp(drag.dx / th, 0, 1), up ? 0 : clamp(-drag.dx / th, 0, 1), up);
    var p = clamp(Math.max(Math.abs(drag.dx), -drag.dy) / (th * 1.3), 0, 1);
    var next = nextCard();
    if (next) next.style.transform = 'translateY(' + (16 - 16 * p).toFixed(1) + 'px) scale(' + (.94 + .06 * p).toFixed(3) + ')';
  }

  function onUp(e) {
    if (!drag || e.pointerId !== drag.id) return;
    var d = drag;
    drag = null;
    var th = threshold();
    var upward = -d.dy > Math.abs(d.dx);
    if (upward && (-d.dy > th || (d.vy < -.7 && -d.dy > 40))) return fly('hero', d);
    if (!upward && (d.dx > th || (d.vx > .6 && d.dx > 40))) return fly('keep', d);
    if (!upward && (d.dx < -th || (d.vx < -.6 && d.dx < -40))) return fly('pass', d);
    d.card.classList.remove('is-dragging');
    d.card.style.transform = '';
    setMarks(d.card, 0, 0, 0);

  /* ---------- results ---------- */
  function tally() {
    var votes = latest(S.votes).filter(function (v) { return S.byId[v.photo]; });
    var users = {}, totalMs = 0, examples = false, per = {}, nVotes = 0;
    var photosIn = S.photos.filter(function (p) { return S.resultsCat === 'all' || catOf(p).id === S.resultsCat; });
    photosIn.forEach(function (p) { per[p.id] = { p: p, n: 0, keep: 0, hero: 0, pass: 0, ms: 0, mine: null }; });
    votes.forEach(function (v) {
      var r = per[v.photo];
      if (!r) return;
      if (S.user && v.user === S.user.key) r.mine = v.verdict;
      users[v.user] = true;
      totalMs += v.ms || 0;
      nVotes++;
      if (v.example) examples = true;
      r.n++; r[v.verdict]++; r.ms += v.ms || 0;
    });
    var rows = Object.keys(per).map(function (k) {
      var r = per[k];
      r.rate = r.n ? (r.keep + r.hero) / r.n : -1;
      r.avg = r.n ? r.ms / r.n : 0;
      return r;
    }).sort(function (a, b) {
      return (b.rate - a.rate) || (b.hero - a.hero) || (b.n - a.n) || String(a.p.caption).localeCompare(String(b.p.caption));
    });
    var voted = rows.filter(function (r) { return r.n > 0; });

    // How often my verdict matches the majority of everyone else.
    var agree = 0, compared = 0;
    voted.forEach(function (r) {
      if (!r.mine || r.n < 2) return;
      var yes = r.keep + r.hero - (r.mine !== 'pass' ? 1 : 0);
      var share = yes / (r.n - 1);
      if (share === .5) return;
      compared++;
      if ((share > .5) === (r.mine !== 'pass')) agree++;
    });
    var reviewers = Object.keys(users).length;
    var hero = voted.slice().sort(function (a, b) { return (b.hero - a.hero) || (b.rate - a.rate); })[0];
    var minN = reviewers >= 3 ? 3 : 2;
    var split = voted.filter(function (r) { return r.n >= minN; })
      .sort(function (a, b) { return (Math.abs(a.rate - .5) - Math.abs(b.rate - .5)) || (b.n - a.n); })[0];
    return {
      rows: rows, voted: voted, photoCount: photosIn.length, reviewers: reviewers, votes: nVotes, avgMs: nVotes ? totalMs / nVotes : 0, examples: examples,
      taste: compared >= 3 ? agree / compared : null,
      hero: hero && hero.hero ? hero : null,
      split: split && Math.abs(split.rate - .5) <= .2 ? split : null
    };
  }

  /* Live results: while the Results tab is open, fetch new swipes every few seconds. */
  var liveTimer = null, livePolls = 0;
  function syncLive() {
    var want = alive() && S.view === 'results' && S.admin && !S.gate && S.store === 'sharepoint' && CONFIG.liveSeconds > 0 && !document.hidden;
    if (want && !liveTimer) liveTimer = setInterval(livePoll, Math.max(3, CONFIG.liveSeconds) * 1000);
    if (!want && liveTimer) { clearInterval(liveTimer); liveTimer = null; }
  }

  function voteSig() { return S.votes.length + ':' + S.votes.reduce(function (a, v) { return a + (v.spId || 0); }, 0); }

  async function livePoll() {
    if (!alive()) { syncLive(); return; }
    if (S.polling) return;
    S.polling = true;
    try {
      var full = ++livePolls % 6 === 0;   // every 6th poll: full reload, which also picks up undos and new photos
      var before = voteSig() + '|' + S.photos.length;
      var r = await loadSpVotes(full ? 0 : S.maxVoteId);
      mergeVotes(r.votes, full);
      S.maxVoteId = Math.max(S.maxVoteId, r.maxId);
      S.updatedAt = new Date();
      if (full && S.lib.state === 'ok') { await loadSpPhotos(); syncDeck(); }
      if (S.view === 'results') {
        if (voteSig() + '|' + S.photos.length !== before) renderResults();
        else { var live = $('ps-live'); if (live) live.outerHTML = liveHtml().replace(/<span class="ps-anon">[\s\S]*$/, ''); }
      }
    } catch (e) {
      S.lastError = e.message;
    }
    S.polling = false;
  }

      if (S.store === 'sharepoint') {
        var r = await loadSpVotes(0);

        S.maxVoteId = Math.max(S.maxVoteId, r.maxId);
        S.updatedAt = new Date();

  function csvCell(v) {
    var s = String(v == null ? '' : v);
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;          // keep spreadsheet formulas from running
    return /[";\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function exportCsv() {
    var R = tally();
    var dec = function (n) { return n.toLocaleString(locale(), { maximumFractionDigits: 1, useGrouping: false }); };
    var lines = [[t('csvRank'), t('csvCaption'), t('catLabel'), t('csvFile'), t('csvVotes'), L('keep'), L('hero'), L('pass'), t('csvPct', { keep: L('keep') }), t('csvAvg')]];
    R.rows.forEach(function (r, i) {
      lines.push([i + 1, r.p.caption, catOf(r.p).name, r.p.name || r.p.id, r.n, r.keep, r.hero, r.pass, r.n ? Math.round(r.rate * 100) : '', r.n ? dec(r.avg / 1000) : '']);
    });
    // Semicolons and a BOM: what Excel expects with Belgian regional settings.
    var csv = '﻿' + lines.map(function (l) { return l.map(csvCell).join(';'); }).join('\r\n');

  /* ---------- manage: upload, caption, remove, shrink ---------- */
  async function decode(blob) {
    if (typeof createImageBitmap === 'function') {
      try {
        var bmp = await createImageBitmap(blob, { imageOrientation: 'from-image' });
        return { src: bmp, w: bmp.width, h: bmp.height, done: function () { if (bmp.close) bmp.close(); } };
      } catch (e) { /* fall back to an <img> */ }
    }
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(blob), img = new Image();
      img.onload = function () { resolve({ src: img, w: img.naturalWidth, h: img.naturalHeight, done: function () { URL.revokeObjectURL(url); } }); };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error(t('unsupported'))); };
      img.src = url;
    });
  }

  // Resizes to maxEdge on the long side as JPEG. Web-ready JPEGs are kept as they are.
  async function prepare(blob, maxEdge, force) {
    var d = await decode(blob);
    try {
      var s = Math.min(1, maxEdge / Math.max(d.w, d.h));
      var w = Math.max(1, Math.round(d.w * s)), h = Math.max(1, Math.round(d.h * s));
      var c = document.createElement('canvas');
      c.width = w; c.height = h;
      var ctx = c.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, w, h);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(d.src, 0, 0, w, h);
      var tc = document.createElement('canvas'), ts = 96 / Math.max(w, h);
      tc.width = Math.max(1, Math.round(w * ts)); tc.height = Math.max(1, Math.round(h * ts));
      tc.getContext('2d').drawImage(c, 0, 0, tc.width, tc.height);
      var thumb = tc.toDataURL('image/jpeg', .7);
      if (!force && s === 1 && blob.type === 'image/jpeg' && blob.size <= 900 * 1024) return { blob: blob, thumb: thumb };
      var out = await new Promise(function (res, rej) {
        c.toBlob(function (b) { if (b) res(b); else rej(new Error(t('unsupported'))); }, 'image/jpeg', .85);
      });
      return { blob: out, thumb: thumb };
    } finally { d.done(); }
  }

  var upSeq = 0, upActive = 0;
  function addFiles(files) {
    var list = Array.prototype.slice.call(files || []);
    if (!list.length || !S.admin) return;
    if (S.view !== 'manage') setView('manage');
    list.forEach(function (f) { S.uploads.push({ key: ++upSeq, file: f, name: f.name, status: 'waiting', cat: S.uploadCat }); });
    pumpUploads();
  }

  function pumpUploads() {
    while (upActive < 2) {
      var u = S.uploads.filter(function (x) { return x.status === 'waiting'; })[0];
      if (!u) break;
      upActive++;
      u.status = 'resizing';
      processUpload(u).then(function () { upActive--; pumpUploads(); });
    }
    renderUploads();
  }

  async function processUpload(u) {
    try {
      var f = u.file;
      if (f.type && !/^image\//.test(f.type)) throw new Error(t('unsupported'));
      var r = await prepare(f, CONFIG.maxPhotoEdge, false);
      u.thumb = r.thumb;
      u.status = 'uploading';
      renderUploads();
      var caption = prettyName(f.name);
      var name = slug(f.name) + '-' + rand(4) + '.jpg';
      var cat = catById(u.cat).id;
      var p = S.mode === 'sharepoint' ? await spUpload(name, r.blob, caption, cat)
        : { id: 'local-' + (++S.seq), name: name, caption: caption, folder: '', cat: cat, src: URL.createObjectURL(r.blob), size: r.blob.size, jpeg: true, local: true };
      S.photos.push(p);
      S.byId[p.id] = p;
      syncDeck();
      u.status = 'done';
    } catch (e) {
      u.status = 'error';
      u.msg = e.message;
      S.lastError = e.message;
    }
    u.file = null;
    renderUploads();
    renderGridSoon();
    renderTop();
    if (S.view === 'swipe') renderStack();

    var p = S.byId[input.dataset.id];

    var cap = input.value.replace(/\s+/g, ' ').trim().slice(0, 255);
    if (!cap) { input.value = p.caption; return; }
    if (cap === p.caption) return;
    var old = p.caption;
    p.caption = cap;
    try {
      if (S.mode === 'sharepoint') await spSetCaption(p.id, cap);
      S.savedCaption = p.id;
      clearTimeout(captionTimer);
      captionTimer = setTimeout(function () { S.savedCaption = null; if (S.view === 'manage') renderManage(); }, 2500);
    } catch (e) {
      p.caption = old;
      S.lastError = e.message;
      toastText(t('captionFail', { err: e.message }), 7000);
    }
    if (S.view === 'manage') renderManage();
  }

  async function shrink(ids) {
    var list = ids.map(function (id) { return S.byId[id]; }).filter(function (p) { return p && p.jpeg && p.uid; });
    if (!list.length || S.shrinking) return;
    S.shrinking = { i: 0, n: list.length };
    var ok = 0;
    for (var i = 0; i < list.length; i++) {
      S.shrinking.i = i + 1;
      renderManage();
      var p = list[i];
      try {
        var res = await fetch(p.src, { credentials: 'same-origin', cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        var blob = await res.blob();
        var out = await prepare(blob, CONFIG.maxPhotoEdge, true);
        if (out.blob.size < blob.size * .9) {
          await spReplace(p, out.blob);
          p.size = out.blob.size;
          p.src = p.src.replace(/\?v=.*$/, '') + '?v=' + Date.now();
          ok++;
        }
      } catch (e) { S.lastError = e.message; }
    }
    S.shrinking = null;
    renderManage();
    toastText(t('shrunk', { n: ok }));
  }

    return { key: 'sp' + me.Id, id: me.Id, name: name, first: parts[0] || name, initials: initials.toUpperCase(),
      email: me.Email || '', upn: me.UserPrincipalName || '', login: me.LoginName || '' };
  }

  /* Example reviewers so the demo's results screen has something to show. Never used on SharePoint. */
  function exampleVotes() {
    var appeal = { cat: .9, rocket: .75, coffee: .6, astronaut: .7, dahlia: .55, 'deep-field': .8, hopper: .65, motorcycle: .35, palace: .5, cameraman: .3 };
    var seed = 7, out = [];
    function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    ['A', 'B', 'C', 'D'].forEach(function (n, i) {
      S.photos.forEach(function (ph) {
        var a = appeal[ph.id] != null ? appeal[ph.id] : .5, r = rnd();
        out.push({ photo: ph.id, verdict: r < a * .22 ? 'hero' : r < a ? 'keep' : 'pass', ms: Math.round(900 + rnd() * 3200),
          user: 'example' + i, name: t('exampleName', { n: n }), example: true, seq: ++S.seq });
      });
    });
    return out;
  }

    var cands = [CTX && CTX.currentUICultureName, CTX && CTX.currentCultureName, document.documentElement.lang]
      .concat(navigator.languages || [navigator.language]);
    for (var i = 0; i < cands.length; i++) {
      var two = String(cands[i] || '').slice(0, 2).toLowerCase();
      if (I18N[two]) return two;
    }
    return 'en';

      if (S.list.state === 'ok' && S.store !== 'sharepoint') {
        var local = S.votes.filter(function (v) { return !v.spId && !v.example; });

        S.store = 'sharepoint';
        local.forEach(function (v) { v.job = { v: v, tries: 0 }; S.queue.push(v.job); });
        persistPending();
        flush();
      }
      buildDeck();
      toastText(t('setupDone'));
      setView(S.photos.length ? S.view : 'manage');
    } catch (e) {
      S.lastError = e.message;
      toastText(t('setupFail', { err: e.message }), 10000);
      await Promise.all([checkLib(), checkVotes()]);
      setView(S.view);

  /* ---------- actions ---------- */
  function onAction(act, id, btn) {
    switch (act) {
      case 'view': setView(id); break;
      case 'back': setView(S.prevView && S.prevView !== 'details' ? S.prevView : 'swipe'); break;
      case 'menu': S.menu = !S.menu; renderMenu(); break;
      case 'lang': setLang(id); break;
      case 'vote': fly(id); break;
      case 'undo': undo(); break;
      case 'intro-start': dismissIntro(); break;
      case 'chapter-go': endChapter(false); break;
      case 'restart': restart(); break;
      case 'retry': retryFailed(); break;
      case 'setup': doSetup(btn); break;
      case 'refresh': refreshAll(btn); break;
      case 'export': exportCsv(); break;
      case 'present': present(); break;
      case 'remove': S.confirmRemove = id; renderManage(); break;
      case 'remove-no': S.confirmRemove = null; renderManage(); break;
      case 'remove-yes': removePhoto(id); break;
      case 'shrink': shrink([id]); break;
      case 'set-cat': setPhotoCategory(id, btn.getAttribute('data-cat')); break;
      case 'up-cat': S.uploadCat = catById(id).id; renderManage(); break;
      case 'man-filter': S.manageCat = id; renderManage(); break;
      case 'res-filter': S.resultsCat = id; renderResults(); break;
      case 'shrink-all':
        shrink(S.photos.filter(function (p) { return p.jpeg && p.uid && p.size > LARGE; }).map(function (p) { return p.id; }));
        break;
      case 'clear-uploads':
        S.uploads = S.uploads.filter(function (u) { return u.status !== 'done' && u.status !== 'error'; });
        renderUploads();
        break;
      case 'clear-local':
        S.votes = S.votes.filter(function (v) { return v.example || v.spId; });
        setStore(localKey(), null);
        S.saved = 0;
        S.history = [];
        buildDeck();
        setView('swipe');
        break;
      case 'preview-lock':
        var back = S.view === 'details' ? (S.prevView && S.prevView !== 'details' ? S.prevView : 'swipe') : S.view;
        S.previewLocked = true;
        S.gate = 'denied';
        setView(back);
        APP.scrollIntoView({ block: 'nearest' });
        break;
      case 'as-reviewer': setReviewerView(id === 'on'); break;
      case 'lock-votes':
        if (btn) btn.disabled = true;
        lockVotes().then(function () { toastText(t('lockedDone')); }, function (e) {
          S.lastError = e.message;
          toastText(t('lockFail', { err: e.message }), 9000);
        }).then(function () { setView(S.view); });
        break;
      case 'end-preview': S.previewLocked = false; S.gate = null; setView(S.view); break;
      case 'copy': copyAddr(btn); break;
      case 'retry-boot': start(); break;
    }
  }

  function wire() {
    APP.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('[data-act]') : null;
      if (!b || !APP.contains(b) || b.disabled) return;
      onAction(b.getAttribute('data-act'), b.getAttribute('data-id'), b);
    });

    document.addEventListener('click', function (e) {
      if (!alive() || !S.menu || !e.target.isConnected) return;   // a re-rendered menu button is no longer in the page
      if (!e.target.closest('#ps-menu') && !e.target.closest('#ps-menu-btn')) { S.menu = false; renderMenu(); }
    });

    // Manage: file picker, drag and drop, caption editing.
    var mv = $('ps-view-manage');
    mv.addEventListener('change', function (e) {
      if (e.target.id === 'ps-file') { addFiles(e.target.files); e.target.value = ''; }
    });
    var hasFiles = function (e) { return e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') !== -1; };
    ['dragenter', 'dragover'].forEach(function (ev) {
      mv.addEventListener(ev, function (e) {
        if (!hasFiles(e)) return;
        e.preventDefault();
        var d = $('ps-drop');
        if (d) d.classList.add('is-over');
      });
    });
    mv.addEventListener('dragleave', function (e) {
      var d = $('ps-drop');
      if (d && !mv.contains(e.relatedTarget)) d.classList.remove('is-over');
    });
    mv.addEventListener('drop', function (e) {
      if (!hasFiles(e)) return;
      e.preventDefault();
      var d = $('ps-drop');
      if (d) d.classList.remove('is-over');
      addFiles(e.dataTransfer.files);
    });
    mv.addEventListener('focusout', function (e) { if (e.target.classList && e.target.classList.contains('ps-cap-in')) saveCaption(e.target); });
    mv.addEventListener('keydown', function (e) {
      if (!e.target.classList || !e.target.classList.contains('ps-cap-in')) return;
      if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); }
      if (e.key === 'Escape') { var p = S.byId[e.target.dataset.id]; if (p) e.target.value = p.caption; e.target.blur(); }
    });

    var stack = $('ps-stack');
    stack.addEventListener('pointerdown', onDown);
    stack.addEventListener('pointermove', onMove);
    stack.addEventListener('pointerup', onUp);
    stack.addEventListener('pointercancel', onUp);
    if (window.ResizeObserver) new ResizeObserver(function () { cards().forEach(fit); }).observe(stack);

    document.addEventListener('keydown', function (e) {
      if (!alive()) return;
      if (e.key === 'Escape' && S.menu) { S.menu = false; renderMenu(); $('ps-menu-btn').focus(); return; }
      if (S.view !== 'swipe' || S.gate || e.altKey || e.ctrlKey || e.metaKey) return;
      var tg = e.target;
      if (tg && (tg.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName))) return;
      var r = APP.getBoundingClientRect();
      if (r.bottom < 80 || r.top > window.innerHeight - 80) return;   // app scrolled out of view: leave keys to the page
      if (S.intro) { if (e.key === 'Enter' && !(tg && tg.closest && tg.closest('button'))) { e.preventDefault(); dismissIntro(); } return; }
      if (S.chapterOn) {
        if (e.key === 'Enter' && !(tg && tg.closest && tg.closest('button'))) { e.preventDefault(); endChapter(false); }
        else if ((e.key === 'Backspace' || e.key === 'z' || e.key === 'Z') && S.history.length) { e.preventDefault(); undo(); }
        return;
      }
      var map = { ArrowLeft: 'pass', ArrowRight: 'keep', ArrowUp: 'hero' };
      if (map[e.key] && topCard()) { e.preventDefault(); fly(map[e.key]); }
      else if ((e.key === 'Backspace' || e.key === 'z' || e.key === 'Z') && S.history.length) { e.preventDefault(); undo(); }
    });

    document.addEventListener('visibilitychange', function () { if (alive()) syncLive(); });
    var onFull = function () {
      if (!alive()) return;
      APP.classList.toggle('is-full', isFull() && (document.fullscreenElement || document.webkitFullscreenElement) === APP);
      if (S.view === 'results') renderResults();
      renderMenu();
    };
    document.addEventListener('fullscreenchange', onFull);
    document.addEventListener('webkitfullscreenchange', onFull);
    window.addEventListener('beforeunload', function (e) {
      if (!alive()) return;
      var busy = S.queue.length || S.uploads.some(function (u) { return u.status === 'waiting' || u.status === 'resizing' || u.status === 'uploading'; });
      if (busy) { e.preventDefault(); e.returnValue = ''; }
    });

    ['pass', 'hero', 'keep'].forEach(function (v) { $('ps-btn-' + v).querySelector('.ps-act-tile').innerHTML = IC[v]; });
    $('ps-menu-btn').innerHTML = icon(P.dots, 'ps-ic--fill');
  }

  /* ---------- start ---------- */
  async function start() {
    S.mode = 'loading'; S.gate = 'loading'; S.gateText = t('gateChecking');
    S.user = null; S.allowed = S.admin = S.realAdmin = false;
    renderFrame();
    var me = null, err = null;
    // Only ask SharePoint who we are when the page is on SharePoint; a local file can't use the sign-in anyway.
    if (ON_SHAREPOINT) { try { me = await whoAmI(); } catch (e) { err = e; } }

    // The data lives on another site and this person has no access there (yet): find out who they are
    // from the page's own site, so they get a clear screen instead of a technical error.
    var pageWeb = CTX && CTX.webAbsoluteUrl ? String(CTX.webAbsoluteUrl).replace(/\/$/, '') : '';
    if (!me && err && (err.status === 401 || err.status === 403) && pageWeb && pageWeb.toLowerCase() !== SITE.toLowerCase()) {
      try {
        var here = await spGet(pageWeb + '/_api/web/currentuser?$select=Id,Title,Email,UserPrincipalName,LoginName');
        S.mode = 'sharepoint';
        S.user = mkUser(here);
        S.realAdmin = isListed(S.user, CONFIG.adminEmails);
        S.allowed = S.realAdmin || isListed(S.user, CONFIG.allowedEmails);
        S.lastError = err.message;
        S.gate = S.allowed ? 'noaccess' : 'denied';
        renderFrame();
        return;
      } catch (e2) { /* show the error screen below */ }
    }

    if (me) {
      S.mode = 'sharepoint';
      S.user = mkUser(me);
      S.realAdmin = isListed(S.user, CONFIG.adminEmails);
      S.allowed = S.realAdmin || isListed(S.user, CONFIG.allowedEmails);
      S.admin = S.realAdmin && !S.asReviewer;
      if (!S.allowed) { S.gate = 'denied'; renderFrame(); return; }
      S.gateText = t('gatePhotos');
      renderFrame();
      await Promise.all([checkLib(), checkVotes()]);
      if (S.lib.state === 'ok') {
        try { await loadSpPhotos(); } catch (e) { S.lib = { state: 'error', error: e.message }; S.lastError = e.message; }
      }
      if (S.list.state === 'ok') {
        S.store = 'sharepoint';
        S.votes = [];
        await loadVotesForRole();
        restorePending();
      } else {
        S.store = 'local';
        S.votes = loadLocalVotes();
      }
    } else if (ON_SHAREPOINT) {
      S.mode = 'sharepoint';
      S.lastError = err ? err.message : 'Unknown error';
      S.gate = 'error';
      renderFrame();
      return;
    } else {
      S.mode = 'demo'; S.store = 'local'; S.allowed = S.realAdmin = true;
      S.admin = !S.asReviewer;
      S.user = { key: 'demo-me', name: t('demoUser'), first: '', initials: '', email: '', upn: '', login: '' };
      setPhotos((window.PS_DEMO_PHOTOS || []).map(function (p) {
        return { id: String(p.id), name: p.file || p.id, caption: p.caption, credit: p.credit, folder: '', cat: catById(p.category).id, src: p.src, size: 0, jpeg: true };
      }));
      S.votes = exampleVotes().concat(loadLocalVotes());
      S.saved = S.votes.filter(function (v) { return !v.example; }).length;
    }

    buildDeck();
    S.gate = null;
    S.intro = S.deck.length > 0 && !getStore('intro-seen', false);
    setView(S.view);
  }

  // Players only ever load their own votes. Admins load every vote they can see.
  async function loadVotesForRole() {
    try {
      var r = await loadSpVotes(0);
      S.votes = r.votes.concat(S.votes.filter(function (v) { return !v.spId && !v.example; }));
      S.maxVoteId = r.maxId;
      S.updatedAt = new Date();
    } catch (e) { S.lastError = e.message; }
  }

  // Lets admins see exactly what players see: no Manage, no Results, only their own votes.
  async function setReviewerView(on) {
    S.asReviewer = !!on;
    S.admin = S.realAdmin && !S.asReviewer;
    S.menu = false;
    if (S.view === 'manage' && !S.admin) S.view = 'swipe';
    if (S.mode === 'sharepoint' && S.store === 'sharepoint') await loadVotesForRole();
    setView(S.view);
    toastText(t(on ? 'reviewerOn' : 'reviewerOff'));
  }

  function boot() {
    S.uploadCat = cats()[0].id;
    APP = document.getElementById('ps-app');
    if (!APP || APP.getAttribute('data-booted')) return;
    APP.setAttribute('data-booted', '1');
    S.lang = pickLang();
    applyStatic();
    wire();
    start();
  }

  // The markup comes first, but some script modules inject scripts before the HTML: wait for it.
  (function whenReady(n) {
    if (document.getElementById('ps-app')) boot();
    else if (n < 200) setTimeout(function () { whenReady(n + 1); }, 50);
  })(0);
})();
</script>
