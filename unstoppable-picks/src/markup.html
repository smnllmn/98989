<div id="ps-app" class="ps" data-shape="auto">
  <svg class="ps-defs" aria-hidden="true" focusable="false"><defs><linearGradient id="ps-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C27FCD"/><stop offset=".55" stop-color="#D60075"/><stop offset="1" stop-color="#E64A47"/></linearGradient></defs></svg>
  <div class="ps-stage">
    <header class="ps-top">
      <span class="ps-round" id="ps-avatar"></span>
      <div class="ps-brand"><span class="ps-name" id="ps-name">Unstoppable Picks</span><span class="ps-sub" id="ps-sub"></span></div>
      <button type="button" class="ps-round" id="ps-menu-btn" data-act="menu" aria-haspopup="true" aria-expanded="false" aria-controls="ps-menu"></button>
      <div class="ps-menu" id="ps-menu" hidden></div>
    </header>

    <section class="ps-gate" id="ps-gate" aria-live="polite"></section>

    <div class="ps-main" id="ps-main" hidden>
      <div class="ps-tabs" id="ps-tabs" role="tablist">
        <button type="button" role="tab" id="ps-tab-swipe" data-act="view" data-id="swipe" aria-controls="ps-view-swipe"></button>
        <button type="button" role="tab" id="ps-tab-results" data-act="view" data-id="results" aria-controls="ps-view-results"></button>
        <button type="button" role="tab" id="ps-tab-manage" data-act="view" data-id="manage" aria-controls="ps-view-manage" hidden></button>
      </div>
      <div class="ps-banner" id="ps-banner" hidden></div>

      <section class="ps-swipe" id="ps-view-swipe" role="tabpanel" aria-labelledby="ps-tab-swipe">
        <div class="ps-progress" aria-hidden="true"><i id="ps-progress-bar"></i></div>
        <div class="ps-stack" id="ps-stack" tabindex="0"></div>
        <div class="ps-actions">
          <button type="button" class="ps-act ps-act--pass" id="ps-btn-pass" data-act="vote" data-id="pass"><span class="ps-act-tile"></span><span class="ps-act-label"></span><kbd></kbd></button>
          <button type="button" class="ps-act ps-act--hero" id="ps-btn-hero" data-act="vote" data-id="hero"><span class="ps-act-tile"></span><span class="ps-act-label"></span><kbd></kbd></button>
          <button type="button" class="ps-act ps-act--keep" id="ps-btn-keep" data-act="vote" data-id="keep"><span class="ps-act-tile"></span><span class="ps-act-label"></span><kbd></kbd></button>
        </div>
      </section>

      <section class="ps-sheet" id="ps-view-results" role="tabpanel" aria-labelledby="ps-tab-results" hidden></section>
      <section class="ps-sheet" id="ps-view-manage" role="tabpanel" aria-labelledby="ps-tab-manage" hidden></section>
      <section class="ps-sheet" id="ps-view-details" hidden></section>
    </div>

    <footer class="ps-foot"><div class="ps-status" id="ps-status" role="status"></div></footer>
  </div>
  <div class="ps-toast" id="ps-toast" aria-live="polite"></div>
</div>
