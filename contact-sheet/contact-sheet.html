.ps {
  --b-raspberry: #C30045;
  --b-magenta: #D60075;
  --b-magenta-dark: #B8005F;
  --b-lavender: #C27FCD;
  --b-coral: #E64A47;
  --b-pink-50: #FCF0F7;
  --b-pink-100: #F8E1EE;
  --b-ink: #272727;
  --b-slate: #44515C;
  --b-muted: #6E7880;
  --b-line: #ECE6EA;
  --b-track: #F1EBEF;
  --b-green: #3A7E4C;
  --b-grad: linear-gradient(120deg, #C27FCD 0%, #D23A8E 45%, #C30045 72%, #E64A47 100%);
  --ps-font: "PS Montserrat", Montserrat, "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --ps-mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  container: ps / inline-size;
  position: relative;
  isolation: isolate;
  overflow: hidden;
  border-radius: 28px;
  color-scheme: light;
  color: #fff;
  font-family: var(--ps-font);
  font-size: 15px;
  font-weight: 500;
  line-height: 1.45;
  text-align: left;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent;
  background:
    radial-gradient(42% 32% at 0% 0%, rgba(194, 127, 205, .6), rgba(194, 127, 205, 0) 72%),
    radial-gradient(46% 36% at 100% 100%, rgba(230, 74, 71, .55), rgba(230, 74, 71, 0) 72%),
    radial-gradient(56% 42% at 50% 46%, rgba(252, 2, 179, .62), rgba(252, 2, 179, 0) 72%),
    linear-gradient(180deg, #C4024B 0%, #C00147 55%, #A90144 100%);
}
/* Only when the app is the whole page (demo file): imitate the intranet's light page. Inside SharePoint the page is left alone. */
body:has(> #ps-app) { margin: 0; padding: 24px 16px; background: #FAFAFA; }
body:has(> #ps-app) > .ps { max-width: 1180px; margin: 0 auto; }

.ps *, .ps *::before, .ps *::after { box-sizing: border-box; }
.ps [hidden] { display: none !important; }
.ps button { font: inherit; color: inherit; cursor: pointer; margin: 0; }
.ps button:focus-visible, .ps a:focus-visible, .ps label:focus-within, .ps-stack:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.ps-sheet button:focus-visible, .ps-sheet a:focus-visible, .ps-panel button:focus-visible, .ps-menu button:focus-visible { outline-color: var(--b-magenta); }
.ps h2, .ps h3, .ps p { margin: 0; }
.ps img { max-width: none; }
.ps-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
.ps-ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ps-ic--fill { fill: currentColor; stroke: none; }
.ps-ic--bold { stroke-width: 2.8; }

.ps-stage { position: relative; max-width: 1120px; margin: 0 auto; min-height: 600px; display: flex; flex-direction: column; gap: 14px; padding: 16px 16px 14px; }
.ps-main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
@container ps (min-width: 700px) { .ps-stage, .ps-main { gap: 16px; } .ps-stage { padding: 22px 28px 18px; } }
.ps.is-full { border-radius: 0; overflow-y: auto; }
.ps.is-full .ps-stage { max-width: 1500px; min-height: 100vh; }

/* glass, as on the app's start screen */
.ps-glass, .ps-round, .ps-tabs, .ps-banner, .ps-act-tile, .ps-btn--glass {
  background: linear-gradient(180deg, rgba(255, 255, 255, .26), rgba(255, 255, 255, .11));
  border: 1px solid rgba(255, 255, 255, .34);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .28), 0 12px 30px -16px rgba(60, 0, 20, .6);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  backdrop-filter: blur(14px) saturate(140%);
}

/* header */
.ps-top { position: relative; z-index: 30; display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 12px; }
.ps-round { width: 44px; height: 44px; padding: 0; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: .92rem; letter-spacing: .02em; }
.ps-round .ps-ic { width: 22px; height: 22px; }
.ps-brand { min-width: 0; text-align: center; }
.ps-name { display: block; font-weight: 800; font-size: 1.32rem; letter-spacing: -.01em; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ps-sub { display: block; min-height: 1.2em; margin-top: 2px; font-size: .8rem; font-weight: 600; opacity: .88; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.ps-menu { position: absolute; top: 54px; right: 0; width: 290px; max-width: calc(100cqi - 32px); padding: 8px; border-radius: 18px; background: #fff; color: var(--b-ink); box-shadow: 0 26px 56px -20px rgba(40, 0, 15, .6); z-index: 40; }

.ps-mi { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 12px; border: 0; border-radius: 12px; background: none; text-align: left; font-weight: 600; font-size: .92rem; color: var(--b-ink) !important; }

/* tabs: glass pill, active tab is a white pill like the app's main button */

.ps-banner { align-self: center; max-width: 760px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 14px; padding: 10px 16px; border-radius: 16px; font-size: .85rem; font-weight: 600; text-align: center; }

/* buttons */
.ps-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 10px 20px; border: 0; border-radius: 999px; background: var(--b-magenta); color: #fff !important; font-weight: 700; font-size: .9rem; line-height: 1.2; text-decoration: none; white-space: nowrap; box-shadow: 0 10px 22px -14px rgba(214, 0, 117, .9); transition: background .15s ease, transform .15s ease; }

.ps-btn--soft:hover { background: var(--b-pink-100); }
.ps-btn--white { background: #fff; color: var(--b-magenta) !important; }

.ps-btn--glass { color: #fff !important; }

.ps-btn--icon { width: 42px; padding: 0; }
.ps-btn[disabled] { opacity: .55; cursor: default; transform: none; }
.ps-btn.is-spinning .ps-ic { animation: ps-spin .8s linear infinite; }
.ps-linkbtn { border: 0; background: none; padding: 0; font-weight: 700; color: var(--b-magenta); text-decoration: underline; text-underline-offset: 3px; }
.ps-foot .ps-linkbtn, .ps-banner .ps-linkbtn { color: #fff; }

/* swipe view */
.ps-swipe { display: flex; flex-direction: column; align-items: center; gap: 14px; --ps-ratio: 3 / 4; --ps-w: min(100%, max(250px, min(400px, calc((100dvh - 350px) * .75)))); }
@container ps (min-width: 700px) {
  .ps[data-shape="auto"] .ps-swipe { --ps-ratio: 4 / 3; --ps-w: min(100%, max(380px, min(680px, calc((100dvh - 350px) * 1.3333)))); }
}
.ps[data-shape="landscape"] .ps-swipe { --ps-ratio: 4 / 3; --ps-w: min(100%, max(300px, min(680px, calc((100dvh - 350px) * 1.3333)))); }
.ps[data-shape="square"] .ps-swipe { --ps-ratio: 1 / 1; --ps-w: min(100%, max(260px, min(520px, calc(100dvh - 350px)))); }
.ps-progress { width: var(--ps-w); height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .22); overflow: hidden; }
.ps-progress i { display: block; width: 0; height: 100%; border-radius: inherit; background: #fff; transition: width .45s ease; }
.ps-stack { position: relative; width: var(--ps-w); aspect-ratio: var(--ps-ratio); margin-bottom: 24px; touch-action: none; user-select: none; -webkit-user-select: none; outline: none; border-radius: 26px; }

.ps-card { position: absolute; inset: 0; border-radius: 26px; transform-origin: 50% 92%; will-change: transform;
  transition: transform .4s cubic-bezier(.2, .8, .2, 1), opacity .4s ease, filter .4s ease; }

.ps-card.is-new { opacity: 0; transform: translateY(48px) scale(.82); }

.ps-card.is-flying { z-index: 4; pointer-events: none; transition: transform .5s cubic-bezier(.3, .5, .4, 1), opacity .5s ease; }
.ps-card.is-nudge { transition: transform .18s ease-out; }
.ps-card-inner { position: absolute; inset: 0; overflow: hidden; border-radius: inherit; background: #3A0F22;
  box-shadow: 0 30px 60px -26px rgba(50, 0, 18, .8), inset 0 0 0 1px rgba(255, 255, 255, .08); }
.ps-card-bg { position: absolute; inset: -40px; display: none; background: center / cover no-repeat; filter: blur(28px) brightness(.7) saturate(1.2); transform: translateZ(0); }
.ps-card.is-contain .ps-card-bg { display: block; }
.ps-card-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; pointer-events: none; -webkit-user-drag: none; transition: opacity .35s ease; }

.ps-card-skel { position: absolute; inset: 0; display: none; background: linear-gradient(100deg, rgba(255, 255, 255, 0) 30%, rgba(255, 255, 255, .13) 50%, rgba(255, 255, 255, 0) 70%) #4A1530; background-size: 220% 100%; animation: ps-shimmer 1.3s linear infinite; }

.ps-card-err { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; text-align: center; font-weight: 700; color: rgba(255, 255, 255, .85); }
.ps-card-err .ps-ic { width: 40px; height: 40px; opacity: .7; }
.ps-card.is-broken .ps-card-err { display: flex; }
.ps-card-shade { position: absolute; left: 0; right: 0; bottom: 0; height: 46%; background: linear-gradient(180deg, rgba(25, 0, 10, 0), rgba(25, 0, 10, .74)); pointer-events: none; }
.ps-card-cap { position: absolute; left: 20px; right: 20px; bottom: 18px; display: flex; flex-direction: column; align-items: flex-start; gap: 5px; color: #fff; text-shadow: 0 1px 14px rgba(0, 0, 0, .35); pointer-events: none; transition: opacity .3s ease; }
.ps-card:not([data-depth="0"]) .ps-card-cap { opacity: 0; }
.ps-card-cap strong { max-width: 100%; font-size: 1.3rem; font-weight: 800; line-height: 1.18; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ps-card-folder { max-width: 100%; padding: 3px 10px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .32); background: rgba(255, 255, 255, .18); font-size: .7rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.ps-tint--pass { background: linear-gradient(90deg, rgba(25, 32, 38, .66), rgba(25, 32, 38, 0) 62%); }
.ps-tint--hero { background: linear-gradient(0deg, rgba(194, 127, 205, .5), rgba(194, 127, 205, 0) 60%); }
.ps-stamp { position: absolute; top: 22px; display: inline-flex; align-items: center; gap: 8px; padding: 9px 18px 9px 13px; border-radius: 999px; color: #fff; font-weight: 800; font-size: 1.15rem; white-space: nowrap; opacity: 0; pointer-events: none; box-shadow: 0 12px 28px -10px rgba(0, 0, 0, .6); }

.ps-stamp--keep { left: 20px; background: var(--b-magenta); transform: rotate(-8deg); }
.ps-stamp--pass { right: 20px; background: var(--b-slate); transform: rotate(8deg); }
.ps-stamp--hero { top: 42%; left: 50%; padding: 12px 24px 12px 18px; background: var(--b-grad); font-size: 1.35rem; transform: translate(-50%, -50%) rotate(-4deg); }

/* panels in the card slot: intro, done, empty, setup */
.ps-state, .ps-intro { position: absolute; inset: 0; z-index: 6; }
.ps-panel { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 26px 22px; overflow: auto; border-radius: 26px; background: #fff; color: var(--b-ink); text-align: center; box-shadow: 0 30px 60px -26px rgba(50, 0, 18, .8); }

/* action tiles under the card, like the app's shortcut tiles */
.ps-actions { display: flex; align-items: flex-start; justify-content: center; gap: clamp(18px, 6cqi, 40px); }
.ps-act { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 0; border: 0; background: none; color: #fff; }

.ps-act-tile { display: grid; place-items: center; width: 70px; height: 70px; border-radius: 24px; transition: transform .18s ease, background .18s ease; }

.ps-act kbd { display: none; padding: 1px 6px; border: 1px solid rgba(255, 255, 255, .35); border-radius: 6px; font-family: inherit; font-size: .66rem; font-weight: 700; opacity: .75; }

.ps-act[disabled] { opacity: .4; cursor: default; }
.ps-act[disabled] .ps-act-tile { transform: none; }

.ps-toast { position: absolute; left: 50%; bottom: 12px; z-index: 50; display: flex; align-items: center; gap: 12px; max-width: calc(100% - 32px); padding: 9px 9px 9px 16px; border-radius: 999px; background: rgba(30, 6, 17, .86); color: #fff; font-size: .88rem; font-weight: 600; box-shadow: 0 18px 40px -16px rgba(0, 0, 0, .65); opacity: 0; pointer-events: none; transform: translate(-50%, 16px); transition: opacity .25s ease, transform .25s ease; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.ps-toast.is-on { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
.ps-toast-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ps-toast button { flex: none; display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; padding: 7px 14px; background: #fff; color: var(--b-magenta); font-weight: 700; font-size: .82rem; }

.ps-toast-dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: #fff; }
.ps-toast-dot--keep { background: #FF5DB1; }
.ps-toast-dot--pass { background: #9AA6B0; }
.ps-toast-dot--hero { background: linear-gradient(135deg, #C27FCD, #FC02B3); }

/* white sheets: results, manage, connection details */
.ps-sheet { width: 100%; max-width: 1060px; align-self: center; padding: 20px 18px 22px; border-radius: 24px; background: #fff; color: var(--b-ink); box-shadow: 0 30px 70px -32px rgba(50, 0, 18, .75); }
@container ps (min-width: 700px) { .ps-sheet { padding: 26px 30px 30px; } }
.ps.is-full .ps-sheet { max-width: 1400px; }
.ps-sheet h2 { font-size: 1.45rem; font-weight: 800; letter-spacing: -.01em; line-height: 1.2; color: var(--b-ink); }

.ps-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; }
.ps-head-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ps-tools { display: flex; flex-wrap: wrap; gap: 8px; }
.ps-note { margin-top: 12px !important; font-size: .8rem; color: var(--b-muted); }
.ps-empty { margin-top: 18px; padding: 28px 20px; border-radius: 18px; background: var(--b-pink-50); text-align: center; color: var(--b-slate); font-weight: 600; }

/* results */
.ps-live { display: inline-flex; align-items: center; gap: 7px; font-size: .78rem; font-weight: 700; color: var(--b-muted); }
.ps-live i { width: 8px; height: 8px; border-radius: 50%; background: var(--b-green); animation: ps-pulse 2s infinite; }
.ps-live.is-off i { background: #B9C0C6; animation: none; }

.ps-kpi { padding: 13px 16px; border-radius: 16px; background: var(--b-pink-50); min-width: 0; }
.ps-kpi span { display: block; font-size: .74rem; font-weight: 700; color: var(--b-slate); }
.ps-kpi b { display: block; margin-top: 2px; font-size: 1.6rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; font-variant-numeric: tabular-nums; color: var(--b-ink); white-space: nowrap; }

.ps-podium { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.22fr) minmax(0, 1fr); align-items: end; gap: clamp(8px, 2.4cqi, 20px); }
.ps-pod { display: flex; flex-direction: column; gap: 8px; min-width: 0; margin: 0; }
.ps-pod--1 { order: 2; }
.ps-pod--2 { order: 1; }

.ps-pod-ph { position: relative; aspect-ratio: 4 / 5; overflow: hidden; border-radius: 18px; background: var(--b-track); box-shadow: 0 18px 34px -22px rgba(50, 0, 18, .7); }

.ps-medal { position: absolute; top: 10px; left: 10px; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .45); background: rgba(25, 0, 10, .55); color: #fff; font-weight: 800; font-size: .92rem; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }

.ps-pod-hero { position: absolute; right: 10px; bottom: 10px; display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px 3px 6px; border-radius: 999px; background: rgba(255, 255, 255, .92); color: var(--b-magenta); font-size: .76rem; font-weight: 800; }
.ps-pod--1 .ps-pod-hero { right: 14px; bottom: 14px; }
.ps-pod-hero .ps-ic { width: 14px; height: 14px; }
.ps-pod figcaption { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ps-pod-cap { font-weight: 700; font-size: .9rem; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ps-pod-score { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 7px; }
.ps-pod-score b { font-size: 1.45rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; color: var(--b-raspberry); font-variant-numeric: tabular-nums; }
.ps-pod--1 .ps-pod-score b { font-size: 1.9rem; }
.ps-pod-score span { font-size: .74rem; font-weight: 600; color: var(--b-muted); }

.ps-highs { display: grid; gap: 10px; margin-top: 20px; }
@container ps (min-width: 640px) { .ps-highs { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); } }
.ps-high { display: flex; align-items: center; gap: 12px; min-width: 0; padding: 12px; border: 1px solid var(--b-line); border-radius: 16px; }
.ps-high > img, .ps-high-ic { flex: none; width: 52px; height: 52px; border-radius: 13px; object-fit: cover; }
.ps-high-ic { display: grid; place-items: center; background: var(--b-grad); color: #fff; font-weight: 800; font-size: .95rem; }

.ps-rank { list-style: none; margin: 0; padding: 0; }

.ps-bar { display: flex; height: 8px; overflow: hidden; border-radius: 8px; background: var(--b-track); }

.ps-chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; background: var(--b-pink-50); color: var(--b-magenta); font-size: .7rem; font-weight: 700; white-space: nowrap; }

  function listPath(title) { return "/_api/web/lists/GetByTitle('" + encodeURIComponent(String(title).replace(/'/g, "''")) + "')"; }
  function libPath() { return listPath(CONFIG.photoLibrary); }
  function votesPath() { return listPath(CONFIG.votesList); }
  function encPath(p) { return String(p).split('/').map(encodeURIComponent).join('/'); }

  function whoAmI() { return spGet('/_api/web/currentuser?$select=Id,Title,Email,UserPrincipalName,LoginName'); }

  async function checkLib() {
    try {
      var j = await spGet(libPath() + '?$select=Id,BaseTemplate,ListItemEntityTypeFullName,RootFolder/ServerRelativeUrl&$expand=RootFolder');
      if ([101, 109, 851].indexOf(j.BaseTemplate) === -1) throw new Error(t('errNotLibrary', { name: CONFIG.photoLibrary }));
      S.lib = { state: 'ok', entityType: j.ListItemEntityTypeFullName, url: (j.RootFolder && j.RootFolder.ServerRelativeUrl) || '' };
    } catch (e) {
      S.lib = { state: e.status === 404 ? 'missing' : 'error', error: e.message };
      if (e.status !== 404) S.lastError = e.message;
    }
  }

  async function checkVotes() {
    try {
      var j = await spGet(votesPath() + '?$select=Id,ListItemEntityTypeFullName,RootFolder/ServerRelativeUrl&$expand=RootFolder');
      var f = await spGet(votesPath() + "/fields?$select=InternalName&$filter=InternalName eq 'Verdict' or InternalName eq 'DwellMs' or InternalName eq 'PhotoName'");
      var have = {};
      (f.value || []).forEach(function (x) { have[x.InternalName] = true; });
      S.list = { state: 'ok', entityType: j.ListItemEntityTypeFullName, url: (j.RootFolder && j.RootFolder.ServerRelativeUrl) || '', fields: have };
      if (S.admin && !(have.Verdict && have.DwellMs && have.PhotoName)) {
        try { await ensureVoteFields(); } catch (e) { S.lastError = e.message; }
      }
      if (!S.list.fields.Verdict) { S.list.state = 'error'; S.list.error = t('errNoVerdict', { list: CONFIG.votesList }); }
    } catch (e) {
      S.list = { state: e.status === 404 ? 'missing' : 'error', error: e.message, fields: {} };
      if (e.status !== 404) S.lastError = e.message;
    }
  }

  // Adds the columns the app writes. Older lists (from v1) get PhotoName added here.
  async function ensureVoteFields() {
    var have = S.list.fields;
    var defs = [['Verdict', 'SP.FieldText', 2], ['DwellMs', 'SP.FieldNumber', 9], ['PhotoName', 'SP.FieldText', 2]];
    for (var i = 0; i < defs.length; i++) {
      if (have[defs[i][0]]) continue;
      await spSend(votesPath() + '/fields', { json: { __metadata: { type: defs[i][1] }, FieldTypeKind: defs[i][2], Title: defs[i][0] } });
      have[defs[i][0]] = true;
      try { await spSend(votesPath() + "/DefaultView/ViewFields/addViewField('" + defs[i][0] + "')"); } catch (e) { /* view tweaks are optional */ }
    }
  }

  async function setupSharePoint() {
    if (S.lib.state === 'missing') {
      await spSend('/_api/web/lists', { json: { __metadata: { type: 'SP.List' }, Title: CONFIG.photoLibrary, BaseTemplate: 101, Description: t('libDescription') } });
      await checkLib();
    }
    if (S.list.state === 'missing') {
      await spSend('/_api/web/lists', { json: { __metadata: { type: 'SP.List' }, Title: CONFIG.votesList, BaseTemplate: 100, Description: t('listDescription') } });
      S.list = { state: 'ok', fields: {} };
      await ensureVoteFields();
      for (var f of ['Author', 'Created']) {
        try { await spSend(votesPath() + "/DefaultView/ViewFields/addViewField('" + f + "')"); } catch (e) { /* optional */ }
      }
      await checkVotes();
    }
  }

  async function loadSpPhotos() {
    var rows = await spGetAll(libPath() + '/items?$select=Id,Title,FileLeafRef,FileRef,Modified,File/Length,File/UniqueId&$expand=File' +
      '&$filter=FSObjType eq 0&$orderby=Id asc&$top=1000', CONFIG.photoLibrary);
    var root = (S.lib.url || '').replace(/\/$/, '').toLowerCase();
    var photos = [], skipped = 0;
    rows.forEach(function (r) {
      var name = r.FileLeafRef || '';
      if (!IMG_RE.test(name)) { skipped++; return; }
      var ref = r.FileRef || '';
      var inLib = root && ref.toLowerCase().indexOf(root + '/') === 0 ? ref.slice(root.length + 1) : name;
      var title = String(r.Title || '').trim();
      photos.push({
        id: String(r.Id), uid: r.File && r.File.UniqueId, name: name,
        caption: title || prettyName(name), folder: inLib.split('/').slice(0, -1).join(' / '),
        src: ORIGIN + encPath(ref) + '?v=' + (Date.parse(r.Modified) || 0),
        size: Number(r.File && r.File.Length) || 0, jpeg: /\.jpe?g$/i.test(name)
      });
    });
    setPhotos(photos);
    S.skipped = skipped;
  }

  function setPhotos(list) {
    S.photos = list;
    S.byId = {};
    list.forEach(function (p) { S.byId[p.id] = p; });
    S.deck = S.deck.filter(function (id) { return S.byId[id]; });
  }

  async function loadSpVotes(sinceId) {
    var rows = await spGetAll(votesPath() + '/items?$select=Id,Title,Verdict,DwellMs,Created,AuthorId,Author/Title&$expand=Author' +
      (sinceId ? '&$filter=Id gt ' + Number(sinceId) : '') + '&$orderby=Id asc&$top=2000', CONFIG.votesList);
    var maxId = sinceId || 0, votes = [];
    rows.forEach(function (it) {
      if (it.Id > maxId) maxId = it.Id;
      if (VERDICTS.indexOf(it.Verdict) === -1) return;
      votes.push({ photo: String(it.Title), verdict: it.Verdict, ms: Number(it.DwellMs) || 0, user: 'sp' + it.AuthorId,
        name: (it.Author && it.Author.Title) || '?', spId: it.Id, seq: it.Id });
    });
    return { votes: votes, maxId: maxId };
  }

  // Server votes replace (full) or extend (incremental) what we have; unsaved local swipes are kept.
  function mergeVotes(server, full) {
    if (full) {
      var pending = S.votes.filter(function (v) { return !v.spId && !v.example; });
      S.votes = server.concat(pending);
      return;
    }
    var have = {};
    S.votes.forEach(function (v) { if (v.spId) have[v.spId] = true; });
    server.forEach(function (v) { if (!have[v.spId]) S.votes.push(v); });
  }

  async function spAddVote(v) {
    var body = { __metadata: { type: S.list.entityType }, Title: v.photo, Verdict: v.verdict };
    if (S.list.fields.DwellMs) body.DwellMs = v.ms;
    if (S.list.fields.PhotoName) body.PhotoName = String((S.byId[v.photo] || {}).name || '').slice(0, 255);
    var res = await spSend(votesPath() + '/items', { json: body, what: CONFIG.votesList });
    var j = await readJson(res);
    return j.Id || j.ID;
  }

  function spRecycle(path, id) { return spSend(path + '/items(' + Number(id) + ')/recycle()'); }

  async function spUpload(name, blob, caption) {
    var res = await spSend(libPath() + "/RootFolder/Files/add(url='" + encodeURIComponent(name.replace(/'/g, "''")) + "',overwrite=false)",
      { body: blob, timeout: 120000, what: CONFIG.photoLibrary });
    var f = await readJson(res);
    var item = await spGet("/_api/web/GetFileById('" + f.UniqueId + "')/ListItemAllFields?$select=Id,Modified");
    if (caption) await spSetCaption(item.Id, caption);
    return {
      id: String(item.Id), uid: f.UniqueId, name: f.Name, caption: caption || prettyName(f.Name), folder: '',
      src: ORIGIN + encPath(f.ServerRelativeUrl) + '?v=' + (Date.parse(item.Modified) || Date.now()),
      size: Number(f.Length) || blob.size, jpeg: true
    };
  }

  function spSetCaption(id, caption) {
    return spSend(libPath() + '/items(' + Number(id) + ')', {
      json: { __metadata: { type: S.lib.entityType }, Title: caption },
      headers: { 'X-HTTP-Method': 'MERGE', 'IF-MATCH': '*' }, what: CONFIG.photoLibrary
    });
  }

  // Replaces a file's content in place: same item, same ID, so its votes stay attached.
  function spReplace(p, blob) {
    return spSend("/_api/web/GetFileById('" + p.uid + "')/$value", { body: blob, headers: { 'X-HTTP-Method': 'PUT' }, timeout: 120000, what: CONFIG.photoLibrary });
  }

  /* ---------- swipes kept in the browser (demo, or no votes list yet) ---------- */
  function localKey() { return S.mode === 'demo' ? 'demo-votes' : 'votes@' + SITE + '|' + (S.user ? S.user.key : ''); }
  function loadLocalVotes() {
    var saved = getStore(localKey(), []);
    return (Array.isArray(saved) ? saved : []).filter(function (v) { return v && VERDICTS.indexOf(v.verdict) !== -1; }).map(function (v) {
      return { photo: String(v.photo), verdict: v.verdict, ms: v.ms || 0, at: v.at, user: S.user.key, name: S.user.name, seq: 1e12 + (++S.seq) };
    });
  }
  function saveLocalVotes() {
    setStore(localKey(), S.votes.filter(function (v) { return !v.example && !v.spId; })
      .map(function (v) { return { photo: v.photo, verdict: v.verdict, ms: v.ms, at: v.at }; }));
  }

  // Swipes waiting for SharePoint survive a reload: they're sent next time the page opens.
  function pendingKey() { return 'pending@' + SITE + '|' + CONFIG.votesList + '|' + (S.user ? S.user.key : ''); }
  function persistPending() {
    if (S.store !== 'sharepoint') return;
    var list = S.queue.filter(function (j) { return !j.cancelled; }).map(function (j) { return j.v; }).concat(S.failed)
      .map(function (v) { return { photo: v.photo, verdict: v.verdict, ms: v.ms, at: v.at }; });
    setStore(pendingKey(), list.length ? list : null);
  }

  /* ---------- recording + saving swipes ---------- */
  function mkVote(photo, verdict, ms) {
    return { photo: photo, verdict: verdict, ms: Math.round(ms || 0), user: S.user.key, name: S.user.name,
      at: new Date().toISOString(), seq: 1e12 + (++S.seq) };
  }

  function record(photo, verdict, ms) {
    var v = mkVote(photo, verdict, ms);
    S.votes.push(v);
    S.done[photo] = true;
    S.history.push(v);
    if (S.history.length > 50) S.history.shift();
    if (S.store === 'sharepoint') {
      v.job = { v: v, tries: 0 };
      S.queue.push(v.job);
      persistPending();
      flush();
    } else {
      saveLocalVotes();
      S.saved++;
    }
    renderStatus();
    renderTop();
    return v;
  }

  function restorePending() {
    var list = getStore(pendingKey(), null);
    if (!Array.isArray(list) || !list.length) return;
    list.forEach(function (x) {
      if (!x || VERDICTS.indexOf(x.verdict) === -1) return;
      var v = mkVote(String(x.photo), x.verdict, x.ms);
      v.at = x.at || v.at;
      v.job = { v: v, tries: 0 };
      S.votes.push(v);
      S.queue.push(v.job);
    });
    flush();
  }

  var flushing = false;
  async function flush() {
    if (flushing) return;
    flushing = true;
    while (S.queue.length && alive()) {
      var job = S.queue[0];
      job.sending = true;
      try {
        var id = await spAddVote(job.v);
        job.v.spId = id;
        S.saved++;
        if (S.queue[0] === job) S.queue.shift();
        if (job.cancelled && id) { try { await spRecycle(votesPath(), id); } catch (e) { /* the next swipe on this photo overrides it anyway */ } }
      } catch (e) {
        job.tries++;
        S.lastError = e.message;
        var permanent = e.status >= 400 && e.status < 500 && [408, 409, 429].indexOf(e.status) === -1;
        if (permanent || job.tries >= 4) {
          if (S.queue[0] === job) S.queue.shift();
          if (!job.cancelled) S.failed.push(job.v);
        } else {
          job.sending = false;
          renderStatus();
          await sleep(1500 * Math.pow(2, job.tries));
        }
      }
      job.sending = false;
      persistPending();
      renderStatus();
    }
    flushing = false;
    renderStatus();
  }

  function retryFailed() {
    S.failed.forEach(function (v) { v.job = { v: v, tries: 0 }; S.queue.push(v.job); });
    S.failed = [];
    persistPending();
    flush();
  }

  function undo() {
    if (S.busy || S.gate) return;
    var v = S.history.pop();
    if (!v) return;
    S.votes = S.votes.filter(function (x) { return x !== v && !(v.spId && x.spId === v.spId); });
    if (S.store === 'sharepoint') {
      var job = v.job, qi = job ? S.queue.indexOf(job) : -1;
      if (qi !== -1 && !job.sending) S.queue.splice(qi, 1);
      else if (job && job.sending) job.cancelled = true;
      else if (v.spId) spRecycle(votesPath(), v.spId).catch(function (e) { S.lastError = e.message; });
      var fi = S.failed.indexOf(v);
      if (fi !== -1) S.failed.splice(fi, 1);
      persistPending();
    } else {
      saveLocalVotes();
      S.saved = Math.max(0, S.saved - 1);
    }
    delete S.done[v.photo];
    if (S.byId[v.photo]) {
      S.deck = S.deck.filter(function (id) { return id !== v.photo; });
      S.deck.unshift(v.photo);
    }
    hideToast();
    if (S.view !== 'swipe') setView('swipe');
    renderStack({ enter: v.verdict });
    renderStatus();
    renderTop();
  }

  /* ---------- deck ---------- */
  function latest(votes) {
    var m = {};
    votes.forEach(function (v) {
      var k = v.user + '|' + v.photo;
      if (!m[k] || (v.seq || 0) >= (m[k].seq || 0)) m[k] = v;
    });
    return Object.keys(m).map(function (k) { return m[k]; });
  }

  function myVotes() {
    var m = {};
    if (!S.user) return m;
    latest(S.votes).forEach(function (v) { if (v.user === S.user.key) m[v.photo] = v.verdict; });
    return m;
  }

  function buildDeck() {
    S.done = {};
    var mine = myVotes();
    Object.keys(mine).forEach(function (id) { if (S.byId[id]) S.done[id] = true; });
    S.deck = shuffle(S.photos.filter(function (p) { return !S.done[p.id]; }).map(function (p) { return p.id; }));
  }

  // Adds photos that appeared since the deck was built (new uploads, a refresh).
  function syncDeck() {
    var inDeck = {};
    S.deck.forEach(function (id) { inDeck[id] = true; });
    var fresh = S.photos.filter(function (p) { return !S.done[p.id] && !inDeck[p.id]; }).map(function (p) { return p.id; });
    S.deck = S.deck.concat(shuffle(fresh));
  }

  function restart() {
    S.done = {};
    S.history = [];
    S.deck = shuffle(S.photos.map(function (p) { return p.id; }));
    renderStack();
    renderTop();
  }

  var lastPhotoCheck = 0;
  async function checkNewPhotos() {
    if (S.mode !== 'sharepoint' || S.lib.state !== 'ok' || Date.now() - lastPhotoCheck < 15000) return;
    lastPhotoCheck = Date.now();
    var before = S.deck.length;
    try { await loadSpPhotos(); syncDeck(); } catch (e) { S.lastError = e.message; return; }
    if (S.deck.length !== before && S.view === 'swipe') renderStack();
    renderTop();
  }

  /* ---------- cards ---------- */
  function cardInner(p) {
    return '<div class="ps-card-inner"><div class="ps-card-bg"></div><div class="ps-card-skel"></div>' +
      '<img class="ps-card-img" alt="' + esc(p.caption) + '" draggable="false">' +
      '<div class="ps-card-err">' + icon(P.image) + '<span>' + T('photoBroken') + '</span></div>' +
      '<div class="ps-card-shade"></div><div class="ps-card-cap">' +
      (p.folder ? '<span class="ps-card-folder">' + esc(p.folder) + '</span>' : '') +
      '<strong>' + esc(p.caption) + '</strong>' + (p.credit ? '<span class="ps-card-credit">' + esc(p.credit) + '</span>' : '') + '</div>' +
      '<div class="ps-tint ps-tint--keep"></div><div class="ps-tint ps-tint--pass"></div><div class="ps-tint ps-tint--hero"></div>' +
      '<span class="ps-stamp ps-stamp--keep">' + IC.keep + esc(L('keep')) + '</span>' +
      '<span class="ps-stamp ps-stamp--pass">' + IC.pass + esc(L('pass')) + '</span>' +
      '<span class="ps-stamp ps-stamp--hero">' + IC.hero + esc(L('hero')) + '</span></div>';
  }

  function makeCard(id) {
    var p = S.byId[id];
    var el = document.createElement('article');
    el.className = 'ps-card is-loading';
    el.dataset.id = id;
    el.setAttribute('aria-label', p.caption);
    el.innerHTML = cardInner(p);
    var img = el.querySelector('.ps-card-img');
    var ready = function () { el.classList.remove('is-loading'); fit(el); };
    img.addEventListener('load', ready);
    img.addEventListener('error', function () { el.classList.remove('is-loading'); el.classList.add('is-broken'); });
    img.src = p.src;
    if (img.complete && img.naturalWidth) ready();
    return el;
  }

  // Photos close to the card's shape fill it; others are shown whole on a blurred copy of themselves.
  function fit(el) {
    var img = el.querySelector('.ps-card-img');
    if (!img || !img.naturalWidth) return;
    var st = $('ps-stack');
    var box = st.offsetWidth && st.offsetHeight ? st.offsetWidth / st.offsetHeight : .75;
    var contain = Math.abs(Math.log((img.naturalWidth / img.naturalHeight) / box)) > .2;
    el.classList.toggle('is-contain', contain);
    var bg = el.querySelector('.ps-card-bg');
    if (contain && !bg.style.backgroundImage) bg.style.backgroundImage = 'url("' + img.src.replace(/["\\\n]/g, encodeURIComponent) + '")';
  }

  var preloaded = {};
  function preload(ids) {
    ids.forEach(function (id) {
      var p = S.byId[id];
      if (!p || preloaded[p.src]) return;
      var im = new Image();
      im.decoding = 'async';
      im.src = p.src;
      preloaded[p.src] = im;
    });
  }

  function cards() {
    return Array.prototype.filter.call($('ps-stack').children, function (el) {
      return el.classList.contains('ps-card') && !el.classList.contains('is-flying');
    });
  }
  function topCard() { return cards().filter(function (el) { return el.dataset.depth === '0'; })[0] || null; }
  function nextCard() { return cards().filter(function (el) { return el.dataset.depth === '1'; })[0] || null; }

  function outTransform(verdict, dx, dy) {
    var st = $('ps-stack'), w = st.offsetWidth || 360, h = st.offsetHeight || 480;
    if (verdict === 'keep') return 'translate(' + Math.round(w * 1.4 + Math.max(0, dx)) + 'px,' + Math.round(dy + 40) + 'px) rotate(22deg)';
    if (verdict === 'pass') return 'translate(' + Math.round(-w * 1.4 + Math.min(0, dx)) + 'px,' + Math.round(dy + 40) + 'px) rotate(-22deg)';
    return 'translate(' + Math.round(dx) + 'px,' + Math.round(-h * 1.5) + 'px) rotate(' + (dx * .03).toFixed(1) + 'deg)';
  }

  function renderStack(opts) {
    opts = opts || {};
    var stack = $('ps-stack');
    S.deck = S.deck.filter(function (id) { return S.byId[id]; });
    var want = S.deck.slice(0, 3);
    var have = cards();
    have.forEach(function (el) { if (want.indexOf(el.dataset.id) === -1) el.remove(); });
    var fresh = [], enter = null;
    want.forEach(function (id, d) {
      var el = have.filter(function (c) { return c.dataset.id === id && c.isConnected; })[0];
      if (!el) {
        el = makeCard(id);
        if (d === 0 && opts.enter) {
          enter = el;
          el.classList.add('is-dragging');
          el.style.transform = outTransform(opts.enter, 0, 0);
          el.style.opacity = '0';
        } else if (!opts.instant) {
          el.classList.add('is-new');
          fresh.push(el);
        }
        stack.insertBefore(el, stack.firstChild);
      } else if (el !== enter) {
        el.classList.remove('is-dragging', 'is-nudge');
        el.style.transform = '';
        el.style.opacity = '';
      }
      el.dataset.depth = String(d);
      if (d === 0) el.removeAttribute('aria-hidden'); else el.setAttribute('aria-hidden', 'true');
    });
    if (enter || fresh.length) {
      void stack.offsetWidth;   // apply the start position before animating
      if (enter) { enter.classList.remove('is-dragging'); enter.style.transform = ''; enter.style.opacity = ''; }
      fresh.forEach(function (el) { el.classList.remove('is-new'); });
    }

    var top = want[0] || null;
    if (top !== S.topId) { S.topId = top; S.shownAt = performance.now(); }
    preload(S.deck.slice(3, 6));

    var state = stack.querySelector('.ps-state');
    var html = top ? '' : panelHtml();
    if (html) {
      if (!state) { state = document.createElement('div'); state.className = 'ps-state'; stack.appendChild(state); }
      state.innerHTML = html;
    } else if (state) state.remove();

    var intro = stack.querySelector('.ps-intro');
    if (S.intro && top) {
      if (!intro) { intro = document.createElement('div'); intro.className = 'ps-intro'; stack.appendChild(intro); }
      intro.innerHTML = introHtml();
    } else if (intro) intro.remove();

    var on = !!top && !S.intro;
    ['pass', 'hero', 'keep'].forEach(function (v) { $('ps-btn-' + v).disabled = !on; });
    var total = S.photos.length;
    var seen = S.photos.filter(function (p) { return S.done[p.id]; }).length;
    $('ps-progress-bar').style.width = total ? (seen / total * 100).toFixed(1) + '%' : '0%';
  }

  function panel(kind, ic, title, text, actions, kicker) {
    return '<div class="ps-panel ps-panel--' + kind + '"><span class="ps-panel-ic">' + ic + '</span>' +
      (kicker ? '<span class="ps-kicker">' + esc(kicker) + '</span>' : '') +
      '<h2>' + esc(title) + '</h2><p>' + esc(text) + '</p>' +
      (actions ? '<div class="ps-row">' + actions + '</div>' : '') + '</div>';
  }

  function panelHtml() {
    if (S.mode === 'sharepoint' && S.lib.state !== 'ok') {
      if (S.lib.state === 'error') return panel('error', icon(P.alert), t('libErrorTitle'), t('libError', { err: S.lib.error || S.lastError }), '');
      if (S.admin) return panel('setup', icon(P.setup), t('setupTitle'), t('setupText', { lib: CONFIG.photoLibrary, list: CONFIG.votesList }),
        '<button type="button" class="ps-btn" data-act="setup">' + T('setupBtn') + '</button>', t('setupKicker'));
      return panel('wait', icon(P.clock), t('notReadyTitle'), t('notReadyText'), '');
    }
    if (!S.photos.length) {
      if (S.admin) return panel('empty', icon(P.image), t('emptyTitle'), S.mode === 'demo' ? t('emptyDemo') : t('emptyAdmin', { lib: CONFIG.photoLibrary }),
        '<button type="button" class="ps-btn" data-act="view" data-id="manage">' + icon(P.upload) + T('addPhotos') + '</button>');
      return panel('empty', icon(P.image), t('emptyTitle'), t('emptyUser'), '');
    }
    var mine = myVotes();
    var keeps = S.photos.filter(function (p) { return mine[p.id] && mine[p.id] !== 'pass'; }).length;
    return panel('done', icon(P.check), t('doneTitle'), t('doneText', { keep: keeps, total: S.photos.length, keepLabel: L('keep') }),

  /* ---------- swiping ---------- */
  function setMarks(card, k, p, h) {
    var q = function (s) { return card.querySelector(s); };
    q('.ps-stamp--keep').style.opacity = k; q('.ps-tint--keep').style.opacity = k;
    q('.ps-stamp--pass').style.opacity = p; q('.ps-tint--pass').style.opacity = p;
    q('.ps-stamp--hero').style.opacity = h; q('.ps-tint--hero').style.opacity = h;
  }

  function fly(verdict, drag) {
    var card = topCard();
    if (!card || S.busy || S.intro || S.gate) return;
    S.busy = true;
    var id = card.dataset.id;
    var ms = Math.min(600000, performance.now() - S.shownAt);
    setMarks(card, verdict === 'keep' ? 1 : 0, verdict === 'pass' ? 1 : 0, verdict === 'hero' ? 1 : 0);
    var go = function () {
      card.classList.remove('is-dragging', 'is-nudge');
      card.classList.add('is-flying');
      card.style.transform = outTransform(verdict, drag ? drag.dx : 0, drag ? drag.dy : 0);
      card.style.opacity = '0';
      setTimeout(function () { card.remove(); }, reduced() ? 30 : 520);
      var v = record(id, verdict, ms);
      S.deck.shift();
      S.busy = false;
      renderStack();
      voteToast(v);
      if (!S.deck.length) checkNewPhotos();
    };
    if (drag || reduced()) { go(); return; }
    // Buttons and keys: nudge the card and show the stamp for a moment, then let it fly.
    card.classList.add('is-nudge');
    card.style.transform = verdict === 'keep' ? 'translateX(26px) rotate(3deg)' : verdict === 'pass' ? 'translateX(-26px) rotate(-3deg)' : 'translateY(-26px)';
    setTimeout(go, 190);
  }

  var drag = null;
  function threshold() { return clamp($('ps-stack').offsetWidth * .26, 80, 150); }

  function onDown(e) {
    var card = topCard();
    if (!card || S.busy || S.intro || !card.contains(e.target) || (e.button != null && e.button !== 0)) return;
    var now = performance.now();
    drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, dx: 0, dy: 0, lx: e.clientX, ly: e.clientY, lt: now, vx: 0, vy: 0, card: card };
    card.classList.add('is-dragging');
    var next = nextCard();
    if (next) next.classList.add('is-dragging');
    try { card.setPointerCapture(e.pointerId); } catch (err) { /* older browsers */ }
  }

  function onMove(e) {
    if (!drag || e.pointerId !== drag.id) return;
    var now = performance.now(), dt = Math.max(1, now - drag.lt);
    drag.vx = (e.clientX - drag.lx) / dt;
    drag.vy = (e.clientY - drag.ly) / dt;
    drag.lx = e.clientX; drag.ly = e.clientY; drag.lt = now;
    drag.dx = e.clientX - drag.x0;
    drag.dy = e.clientY - drag.y0;
    drag.card.style.transform = 'translate(' + drag.dx + 'px,' + drag.dy + 'px) rotate(' + (drag.dx * .05).toFixed(2) + 'deg)';
    var th = threshold();
    var up = -drag.dy > Math.abs(drag.dx) ? clamp(-drag.dy / th, 0, 1) : 0;
    setMarks(drag.card, up ? 0 : clamp(drag.dx / th, 0, 1), up ? 0 : clamp(-drag.dx / th, 0, 1), up);
    var p = clamp(Math.max(Math.abs(drag.dx), -drag.dy) / (th * 1.3), 0, 1);
    var next = nextCard();
    if (next) next.style.transform = 'translateY(' + (16 - 16 * p).toFixed(1) + 'px) scale(' + (.94 + .06 * p).toFixed(3) + ')';
  }

  function onUp(e) {
    if (!drag || e.pointerId !== drag.id) return;

    if (!upward && (d.dx > th || (d.vx > .6 && d.dx > 40))) return fly('keep', d);
    if (!upward && (d.dx < -th || (d.vx < -.6 && d.dx < -40))) return fly('pass', d);
    d.card.classList.remove('is-dragging');
    d.card.style.transform = '';
    setMarks(d.card, 0, 0, 0);
    var next = nextCard();

  }

  /* ---------- toast ---------- */

  function toastText(text, ms) { showToast('<span class="ps-toast-text">' + esc(text) + '</span>', ms); }
  function voteToast(v) {
    var p = S.byId[v.photo] || {};
    showToast('<span class="ps-toast-dot ps-toast-dot--' + v.verdict + '"></span><span class="ps-toast-text">' + esc(L(v.verdict)) + ' · ' + esc(p.caption || '') +
      '</span><button type="button" data-act="undo">' + icon(P.undo) + T('undo') + '</button>');

  /* ---------- results ---------- */
  function tally() {
    var votes = latest(S.votes).filter(function (v) { return S.byId[v.photo]; });
    var users = {}, totalMs = 0, examples = false, per = {};
    S.photos.forEach(function (p) { per[p.id] = { p: p, n: 0, keep: 0, hero: 0, pass: 0, ms: 0, mine: null }; });
    votes.forEach(function (v) {
      var r = per[v.photo];
      users[v.user] = true;
      totalMs += v.ms || 0;
      if (v.example) examples = true;
      r.n++; r[v.verdict]++; r.ms += v.ms || 0;
      if (S.user && v.user === S.user.key) r.mine = v.verdict;
    });
    var rows = Object.keys(per).map(function (k) {
      var r = per[k];
      r.rate = r.n ? (r.keep + r.hero) / r.n : -1;
      r.avg = r.n ? r.ms / r.n : 0;
      return r;
    }).sort(function (a, b) {
      return (b.rate - a.rate) || (b.hero - a.hero) || (b.n - a.n) || String(a.p.caption).localeCompare(String(b.p.caption));
    });
    var voted = rows.filter(function (r) { return r.n > 0; });

    // How often my verdict matches the majority of everyone else.
    var agree = 0, compared = 0;
    voted.forEach(function (r) {
      if (!r.mine || r.n < 2) return;
      var yes = r.keep + r.hero - (r.mine !== 'pass' ? 1 : 0);
      var share = yes / (r.n - 1);
      if (share === .5) return;
      compared++;
      if ((share > .5) === (r.mine !== 'pass')) agree++;
    });
    var reviewers = Object.keys(users).length;
    var hero = voted.slice().sort(function (a, b) { return (b.hero - a.hero) || (b.rate - a.rate); })[0];
    var minN = reviewers >= 3 ? 3 : 2;
    var split = voted.filter(function (r) { return r.n >= minN; })
      .sort(function (a, b) { return (Math.abs(a.rate - .5) - Math.abs(b.rate - .5)) || (b.n - a.n); })[0];
    return {
      rows: rows, voted: voted, reviewers: reviewers, votes: votes.length, avgMs: votes.length ? totalMs / votes.length : 0, examples: examples,
      taste: compared >= 3 ? agree / compared : null,
      hero: hero && hero.hero ? hero : null,
      split: split && Math.abs(split.rate - .5) <= .2 ? split : null
    };
  }

  function isFull() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }

  /* Live results: while the Results tab is open, fetch new swipes every few seconds. */
  var liveTimer = null, livePolls = 0;
  function syncLive() {
    var want = alive() && S.view === 'results' && !S.gate && S.store === 'sharepoint' && CONFIG.liveSeconds > 0 && !document.hidden;
    if (want && !liveTimer) liveTimer = setInterval(livePoll, Math.max(3, CONFIG.liveSeconds) * 1000);
    if (!want && liveTimer) { clearInterval(liveTimer); liveTimer = null; }
  }

  function voteSig() { return S.votes.length + ':' + S.votes.reduce(function (a, v) { return a + (v.spId || 0); }, 0); }

  async function livePoll() {
    if (!alive()) { syncLive(); return; }
    if (S.polling) return;
    S.polling = true;
    try {
      var full = ++livePolls % 6 === 0;   // every 6th poll: full reload, which also picks up undos and new photos
      var before = voteSig() + '|' + S.photos.length;
      var r = await loadSpVotes(full ? 0 : S.maxVoteId);
      mergeVotes(r.votes, full);
      S.maxVoteId = Math.max(S.maxVoteId, r.maxId);
      if (full && S.lib.state === 'ok') { await loadSpPhotos(); syncDeck(); }
      S.updatedAt = new Date();
      if (S.view === 'results') {
        if (voteSig() + '|' + S.photos.length !== before) renderResults();
        else { var live = $('ps-live'); if (live) live.outerHTML = liveHtml(); }
      }
    } catch (e) {
      S.lastError = e.message;
    }
    S.polling = false;
  }

    try {
      if (S.lib.state === 'ok') { await loadSpPhotos(); syncDeck(); }
      if (S.store === 'sharepoint') {
        var r = await loadSpVotes(0);

        S.maxVoteId = Math.max(S.maxVoteId, r.maxId);

  function csvCell(v) {

    return /[";\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function exportCsv() {
    var R = tally();

    var lines = [[t('csvRank'), t('csvCaption'), t('csvFile'), t('csvVotes'), L('keep'), L('hero'), L('pass'), t('csvPct', { keep: L('keep') }), t('csvAvg')]];
    R.rows.forEach(function (r, i) {

    });

  /* ---------- manage: upload, caption, remove, shrink ---------- */
  async function decode(blob) {
    if (typeof createImageBitmap === 'function') {
      try {
        var bmp = await createImageBitmap(blob, { imageOrientation: 'from-image' });
        return { src: bmp, w: bmp.width, h: bmp.height, done: function () { if (bmp.close) bmp.close(); } };
      } catch (e) { /* fall back to an <img> */ }
    }
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(blob), img = new Image();
      img.onload = function () { resolve({ src: img, w: img.naturalWidth, h: img.naturalHeight, done: function () { URL.revokeObjectURL(url); } }); };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error(t('unsupported'))); };
      img.src = url;
    });
  }

  // Resizes to maxEdge on the long side as JPEG. Web-ready JPEGs are kept as they are.
  async function prepare(blob, maxEdge, force) {
    var d = await decode(blob);
    try {
      var s = Math.min(1, maxEdge / Math.max(d.w, d.h));
      var w = Math.max(1, Math.round(d.w * s)), h = Math.max(1, Math.round(d.h * s));
      var c = document.createElement('canvas');
      c.width = w; c.height = h;
      var ctx = c.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, w, h);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(d.src, 0, 0, w, h);
      var tc = document.createElement('canvas'), ts = 96 / Math.max(w, h);
      tc.width = Math.max(1, Math.round(w * ts)); tc.height = Math.max(1, Math.round(h * ts));
      tc.getContext('2d').drawImage(c, 0, 0, tc.width, tc.height);
      var thumb = tc.toDataURL('image/jpeg', .7);
      if (!force && s === 1 && blob.type === 'image/jpeg' && blob.size <= 900 * 1024) return { blob: blob, thumb: thumb };
      var out = await new Promise(function (res, rej) {
        c.toBlob(function (b) { if (b) res(b); else rej(new Error(t('unsupported'))); }, 'image/jpeg', .85);
      });
      return { blob: out, thumb: thumb };
    } finally { d.done(); }
  }

  var upSeq = 0, upActive = 0;
  function addFiles(files) {
    var list = Array.prototype.slice.call(files || []);
    if (!list.length || !S.admin) return;
    if (S.view !== 'manage') setView('manage');
    list.forEach(function (f) { S.uploads.push({ key: ++upSeq, file: f, name: f.name, status: 'waiting' }); });
    pumpUploads();
  }

  function pumpUploads() {
    while (upActive < 2) {
      var u = S.uploads.filter(function (x) { return x.status === 'waiting'; })[0];
      if (!u) break;
      upActive++;
      u.status = 'resizing';
      processUpload(u).then(function () { upActive--; pumpUploads(); });
    }
    renderUploads();
  }

  async function processUpload(u) {
    try {
      var f = u.file;
      if (f.type && !/^image\//.test(f.type)) throw new Error(t('unsupported'));
      var r = await prepare(f, CONFIG.maxPhotoEdge, false);
      u.thumb = r.thumb;
      u.status = 'uploading';
      renderUploads();
      var caption = prettyName(f.name);
      var name = slug(f.name) + '-' + rand(4) + '.jpg';
      var p = S.mode === 'sharepoint' ? await spUpload(name, r.blob, caption)
        : { id: 'local-' + (++S.seq), name: name, caption: caption, folder: '', src: URL.createObjectURL(r.blob), size: r.blob.size, jpeg: true, local: true };
      S.photos.push(p);
      S.byId[p.id] = p;
      syncDeck();
      u.status = 'done';
    } catch (e) {
      u.status = 'error';
      u.msg = e.message;
      S.lastError = e.message;
    }
    u.file = null;
    renderUploads();
    renderGridSoon();
    renderTop();
    if (S.view === 'swipe') renderStack();
  }

  var gridTimer = null;
  function renderGridSoon() {
    clearTimeout(gridTimer);
    gridTimer = setTimeout(function () { if (S.view === 'manage') renderManage(); }, 250);
  }

  function renderUploads() {
    var el = $('ps-ups');

  var captionTimer = null;
  async function saveCaption(input) {
    var p = S.byId[input.dataset.id];
    if (!p) return;
    var cap = input.value.replace(/\s+/g, ' ').trim().slice(0, 255);
    if (!cap) { input.value = p.caption; return; }
    if (cap === p.caption) return;
    var old = p.caption;
    p.caption = cap;
    try {
      if (S.mode === 'sharepoint') await spSetCaption(p.id, cap);
      S.savedCaption = p.id;
      clearTimeout(captionTimer);
      captionTimer = setTimeout(function () { S.savedCaption = null; if (S.view === 'manage') renderManage(); }, 2500);
    } catch (e) {
      p.caption = old;
      S.lastError = e.message;
      toastText(t('captionFail', { err: e.message }), 7000);
    }
    if (S.view === 'manage') renderManage();
  }

  async function removePhoto(id) {
    var p = S.byId[id];
    S.confirmRemove = null;
    if (!p) { renderManage(); return; }
    try {
      if (S.mode === 'sharepoint') await spRecycle(libPath(), p.id);
      else if (p.local) URL.revokeObjectURL(p.src);
      setPhotos(S.photos.filter(function (x) { return x.id !== id; }));
      delete S.done[id];
      toastText(t(S.mode === 'sharepoint' ? 'removed' : 'removedDemo', { name: p.caption }));
    } catch (e) {
      S.lastError = e.message;
      toastText(t('removeFail', { err: e.message }), 7000);
    }
    renderManage();
    renderTop();
  }

  async function shrink(ids) {
    var list = ids.map(function (id) { return S.byId[id]; }).filter(function (p) { return p && p.jpeg && p.uid; });
    if (!list.length || S.shrinking) return;
    S.shrinking = { i: 0, n: list.length };
    var ok = 0;
    for (var i = 0; i < list.length; i++) {
      S.shrinking.i = i + 1;
      renderManage();
      var p = list[i];
      try {
        var res = await fetch(p.src, { credentials: 'same-origin', cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        var blob = await res.blob();
        var out = await prepare(blob, CONFIG.maxPhotoEdge, true);
        if (out.blob.size < blob.size * .9) {
          await spReplace(p, out.blob);
          p.size = out.blob.size;
          p.src = p.src.replace(/\?v=.*$/, '') + '?v=' + Date.now();
          ok++;
        }
      } catch (e) { S.lastError = e.message; }
    }
    S.shrinking = null;
    renderManage();
    toastText(t('shrunk', { n: ok }));
  }

  /* ---------- people ---------- */
  function mkUser(me) {
    var name = String(me.Title || '').replace(/\s*\([^)]*\)\s*$/, '').trim() || me.Email || 'You';
    var parts = name.split(/\s+/).filter(Boolean);
    var initials = (parts[0] || '?').charAt(0) + (parts.length > 1 ? parts[parts.length - 1].charAt(0) : '');
    return { key: 'sp' + me.Id, id: me.Id, name: name, first: parts[0] || name, initials: initials.toUpperCase(),
      email: me.Email || '', upn: me.UserPrincipalName || '', login: me.LoginName || '' };
  }

  function isListed(u, list) {
    var allow = (list || []).map(function (e) { return String(e).trim().toLowerCase(); });
    var login = (u.login || '').split('|').pop();
    return [u.email, u.upn, login].some(function (x) { return x && allow.indexOf(String(x).toLowerCase()) !== -1; });
  }

  /* Example reviewers so the demo's results screen has something to show. Never used on SharePoint. */
  function exampleVotes() {
    var appeal = { cat: .9, rocket: .75, coffee: .6, astronaut: .7, dahlia: .55, 'deep-field': .8, hopper: .65, motorcycle: .35, palace: .5, cameraman: .3 };
    var seed = 7, out = [];
    function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    ['A', 'B', 'C', 'D'].forEach(function (n, i) {
      S.photos.forEach(function (ph) {
        var a = appeal[ph.id] != null ? appeal[ph.id] : .5, r = rnd();
        out.push({ photo: ph.id, verdict: r < a * .22 ? 'hero' : r < a ? 'keep' : 'pass', ms: Math.round(900 + rnd() * 3200),
          user: 'example' + i, name: t('exampleName', { n: n }), example: true, seq: ++S.seq });
      });
    });
    return out;
  }

  function pickLang() {
    var saved = getStore('lang', null);
    if (saved && I18N[saved]) return saved;
    var forced = String(CONFIG.language || 'auto').toLowerCase();
    if (I18N[forced]) return forced;
    var cands = [CTX && CTX.currentUICultureName, CTX && CTX.currentCultureName, document.documentElement.lang]
      .concat(navigator.languages || [navigator.language]);
    for (var i = 0; i < cands.length; i++) {
      var two = String(cands[i] || '').slice(0, 2).toLowerCase();
      if (I18N[two]) return two;
    }
    return 'en';
  }

  async function doSetup(btn) {
    if (btn) { btn.disabled = true; btn.textContent = t('setupBusy'); }
    try {
      await setupSharePoint();
      if (S.lib.state === 'ok') await loadSpPhotos();
      if (S.list.state === 'ok' && S.store !== 'sharepoint') {
        var local = S.votes.filter(function (v) { return !v.spId && !v.example; });
        setStore(localKey(), null);
        S.store = 'sharepoint';
        local.forEach(function (v) { v.job = { v: v, tries: 0 }; S.queue.push(v.job); });
        persistPending();
        flush();
      }
      buildDeck();
      toastText(t('setupDone'));
      setView(S.photos.length ? S.view : 'manage');
    } catch (e) {
      S.lastError = e.message;
      toastText(t('setupFail', { err: e.message }), 10000);
      await Promise.all([checkLib(), checkVotes()]);
      setView(S.view);
    }
  }

      sel.removeAllRanges();
      sel.addRange(r);
      btn.textContent = t('selected');

  /* ---------- actions ---------- */
  function onAction(act, id, btn) {
    switch (act) {
      case 'view': setView(id); break;
      case 'back': setView(S.prevView && S.prevView !== 'details' ? S.prevView : 'swipe'); break;
      case 'menu': S.menu = !S.menu; renderMenu(); break;
      case 'lang': setLang(id); break;
      case 'vote': fly(id); break;
      case 'undo': undo(); break;
      case 'intro-start': dismissIntro(); break;
      case 'restart': restart(); break;
      case 'retry': retryFailed(); break;
      case 'setup': doSetup(btn); break;
      case 'refresh': refreshAll(btn); break;
      case 'export': exportCsv(); break;
      case 'present': present(); break;
      case 'remove': S.confirmRemove = id; renderManage(); break;
      case 'remove-no': S.confirmRemove = null; renderManage(); break;
      case 'remove-yes': removePhoto(id); break;
      case 'shrink': shrink([id]); break;
      case 'shrink-all':
        shrink(S.photos.filter(function (p) { return p.jpeg && p.uid && p.size > LARGE; }).map(function (p) { return p.id; }));
        break;
      case 'clear-uploads':
        S.uploads = S.uploads.filter(function (u) { return u.status !== 'done' && u.status !== 'error'; });
        renderUploads();
        break;
      case 'clear-local':
        S.votes = S.votes.filter(function (v) { return v.example || v.spId; });
        setStore(localKey(), null);
        S.saved = 0;
        S.history = [];
        buildDeck();
        setView('swipe');
        break;
      case 'preview-lock':
        S.previewLocked = true;
        S.gate = 'denied';
        setView(S.prevView && S.prevView !== 'details' ? S.prevView : 'swipe');
        APP.scrollIntoView({ block: 'nearest' });
        break;
      case 'end-preview': S.previewLocked = false; S.gate = null; setView(S.view); break;
      case 'copy': copyAddr(btn); break;
      case 'retry-boot': start(); break;
    }
  }

  function wire() {
    APP.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('[data-act]') : null;
      if (!b || !APP.contains(b) || b.disabled) return;
      onAction(b.getAttribute('data-act'), b.getAttribute('data-id'), b);
    });

    document.addEventListener('click', function (e) {
      if (!alive() || !S.menu) return;
      if (!e.target.closest('#ps-menu') && !e.target.closest('#ps-menu-btn')) { S.menu = false; renderMenu(); }
    });

    // Manage: file picker, drag and drop, caption editing.
    var mv = $('ps-view-manage');
    mv.addEventListener('change', function (e) {
      if (e.target.id === 'ps-file') { addFiles(e.target.files); e.target.value = ''; }
    });
    var hasFiles = function (e) { return e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') !== -1; };
    ['dragenter', 'dragover'].forEach(function (ev) {
      mv.addEventListener(ev, function (e) {
        if (!hasFiles(e)) return;
        e.preventDefault();
        var d = $('ps-drop');
        if (d) d.classList.add('is-over');
      });
    });
    mv.addEventListener('dragleave', function (e) {
      var d = $('ps-drop');
      if (d && !mv.contains(e.relatedTarget)) d.classList.remove('is-over');
    });
    mv.addEventListener('drop', function (e) {
      if (!hasFiles(e)) return;
      e.preventDefault();
      var d = $('ps-drop');
      if (d) d.classList.remove('is-over');
      addFiles(e.dataTransfer.files);
    });
    mv.addEventListener('focusout', function (e) { if (e.target.classList && e.target.classList.contains('ps-cap-in')) saveCaption(e.target); });
    mv.addEventListener('keydown', function (e) {
      if (!e.target.classList || !e.target.classList.contains('ps-cap-in')) return;
      if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); }
      if (e.key === 'Escape') { var p = S.byId[e.target.dataset.id]; if (p) e.target.value = p.caption; e.target.blur(); }
    });

    var stack = $('ps-stack');
    stack.addEventListener('pointerdown', onDown);
    stack.addEventListener('pointermove', onMove);
    stack.addEventListener('pointerup', onUp);
    stack.addEventListener('pointercancel', onUp);
    if (window.ResizeObserver) new ResizeObserver(function () { cards().forEach(fit); }).observe(stack);

    document.addEventListener('keydown', function (e) {
      if (!alive()) return;
      if (e.key === 'Escape' && S.menu) { S.menu = false; renderMenu(); $('ps-menu-btn').focus(); return; }
      if (S.view !== 'swipe' || S.gate || e.altKey || e.ctrlKey || e.metaKey) return;
      var tg = e.target;
      if (tg && (tg.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName))) return;
      var r = APP.getBoundingClientRect();
      if (r.bottom < 80 || r.top > window.innerHeight - 80) return;   // app scrolled out of view: leave keys to the page
      if (S.intro) { if (e.key === 'Enter' && !(tg && tg.closest && tg.closest('button'))) { e.preventDefault(); dismissIntro(); } return; }
      var map = { ArrowLeft: 'pass', ArrowRight: 'keep', ArrowUp: 'hero' };
      if (map[e.key] && topCard()) { e.preventDefault(); fly(map[e.key]); }
      else if ((e.key === 'Backspace' || e.key === 'z' || e.key === 'Z') && S.history.length) { e.preventDefault(); undo(); }
    });

    document.addEventListener('visibilitychange', function () { if (alive()) syncLive(); });
    var onFull = function () {
      if (!alive()) return;
      APP.classList.toggle('is-full', isFull() && (document.fullscreenElement || document.webkitFullscreenElement) === APP);
      if (S.view === 'results') renderResults();
      renderMenu();
    };
    document.addEventListener('fullscreenchange', onFull);
    document.addEventListener('webkitfullscreenchange', onFull);
    window.addEventListener('beforeunload', function (e) {
      if (!alive()) return;
      var busy = S.queue.length || S.uploads.some(function (u) { return u.status === 'waiting' || u.status === 'resizing' || u.status === 'uploading'; });
      if (busy) { e.preventDefault(); e.returnValue = ''; }
    });

    ['pass', 'hero', 'keep'].forEach(function (v) { $('ps-btn-' + v).querySelector('.ps-act-tile').innerHTML = IC[v]; });
    $('ps-menu-btn').innerHTML = icon(P.dots, 'ps-ic--fill');
  }

  /* ---------- start ---------- */
  async function start() {
    S.mode = 'loading'; S.gate = 'loading'; S.gateText = t('gateChecking');
    S.user = null; S.allowed = S.admin = false;
    renderFrame();
    var me = null, err = null;
    // Only ask SharePoint who we are when we're actually on SharePoint (or a site is configured).
    if (ON_SHAREPOINT || CONFIG.siteUrl) { try { me = await whoAmI(); } catch (e) { err = e; } }

    if (me) {
      S.mode = 'sharepoint';
      S.user = mkUser(me);
      S.allowed = isListed(S.user, CONFIG.allowedEmails);
      S.admin = S.allowed && isListed(S.user, CONFIG.adminEmails);
      if (!S.allowed) { S.gate = 'denied'; renderFrame(); return; }
      S.gateText = t('gatePhotos');
      renderFrame();
      await Promise.all([checkLib(), checkVotes()]);
      if (S.lib.state === 'ok') {
        try { await loadSpPhotos(); } catch (e) { S.lib = { state: 'error', error: e.message }; S.lastError = e.message; }
      }
      if (S.list.state === 'ok') {
        S.store = 'sharepoint';
        try {
          var r = await loadSpVotes(0);
          S.votes = r.votes;
          S.maxVoteId = r.maxId;
          S.updatedAt = new Date();
        } catch (e) { S.lastError = e.message; }
        restorePending();
      } else {
        S.store = 'local';
        S.votes = loadLocalVotes();
      }
    } else if (ON_SHAREPOINT) {
      S.mode = 'sharepoint';
      S.lastError = err ? err.message : 'Unknown error';
      S.gate = 'error';
      renderFrame();
      return;
    } else {
      S.mode = 'demo'; S.store = 'local'; S.allowed = S.admin = true;
      S.user = { key: 'demo-me', name: t('demoUser'), first: '', initials: '', email: '', upn: '', login: '' };
      setPhotos((window.PS_DEMO_PHOTOS || []).map(function (p) {
        return { id: String(p.id), name: p.file || p.id, caption: p.caption, credit: p.credit, folder: '', src: p.src, size: 0, jpeg: true };
      }));
      S.votes = exampleVotes().concat(loadLocalVotes());
      S.saved = S.votes.filter(function (v) { return !v.example; }).length;
    }

    buildDeck();
    S.gate = null;
    S.intro = S.deck.length > 0 && !getStore('intro-seen', false);
    setView(S.view);
  }

  function boot() {
    APP = document.getElementById('ps-app');
    if (!APP || APP.getAttribute('data-booted')) return;
    APP.setAttribute('data-booted', '1');
    S.lang = pickLang();
    applyStatic();
    wire();
    start();
  }

  // The markup comes first, but some script modules inject scripts before the HTML: wait for it.
  (function whenReady(n) {
    if (document.getElementById('ps-app')) boot();
    else if (n < 200) setTimeout(function () { whenReady(n + 1); }, 50);
  })(0);
})();
</script>
